<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- AFEIFEI 阿飞飞 · 应用图标 v3：奶油方底 + 主粉拨片（参考① 优化版）。
     底板：品牌奶油色圆角方（Windows 任务栏深浅壁纸都压得住）；
     拨片：in-app LogoMark 同源记号，放大铺满 + 8° 签名倾斜；
     不加投影：低透明度大模糊会量化成环带（v2 教训）。托盘用去底变体。 -->
<defs>
  <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF8F5"/>
    <stop offset="1" stop-color="#FFE9F0"/>
  </linearGradient>
  <linearGradient id="pick" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E0448F"/>
    <stop offset="1" stop-color="#C22977"/>
  </linearGradient>
</defs>
<rect id="plate" x="0" y="0" width="512" height="512" rx="112" fill="url(#plate)"/>
<g transform="rotate(8 256 256) translate(256 258) scale(10.4) translate(-24 -23)">
    <path d="M24 4.6c8 0 15.2 6.4 15.2 14.3 0 8.8-8.2 16.4-12.9 20.7-1.3 1.2-3.3 1.2-4.6 0C17 35.3 8.8 27.7 8.8 18.9 8.8 11 16 4.6 24 4.6z" fill="url(#pick)"/>
    <!-- 印刷卡纸感：内描边 -->
    <path d="M24 7.6c6.7 0 12.4 5.3 12.4 11.6 0 7.3-6.7 13.7-10.7 17.4-1 1-2.4 1-3.4 0-4-3.7-10.7-10.1-10.7-17.4 0-6.3 5.7-11.6 12.4-11.6z" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width=".8"/>
    <path d="M24 4.6c8 0 15.2 6.4 15.2 14.3 0 2.2-.5 4.3-1.5 6.2C33.9 18 29.4 12.7 24 4.6z" fill="#fff" opacity=".25"/>
    <g fill="#fff" opacity=".96">
      <rect x="26.8" y="16" width="2.4" height="10.4" rx="1.2"/>
      <circle cx="24.2" cy="26.8" r="4.1"/>
      <rect x="28.6" y="13.6" width="5.6" height="2.6" rx="1.3" transform="rotate(12 31.4 14.9)"/>
    </g>
  </g>
</svg>
