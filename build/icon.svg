     平涂粉（渐变极弱）贴近原稿；托盘仍用去底变体（render-icon.mjs 剥 plate）。 -->
<defs>
  <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F7F2E8"/>
    <stop offset="1" stop-color="#F2EBDD"/>
  </linearGradient>
  <linearGradient id="pick" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F7589A"/>
    <stop offset="1" stop-color="#EF4389"/>
  </linearGradient>
</defs>
<rect id="plate" x="0" y="0" width="512" height="512" rx="112" fill="url(#plate)"/>
<path d="M256 112c74 0 140 34 140 98 0 92-74 164-124 202-10 8-22 8-32 0-50-38-124-110-124-202 0-64 66-98 140-98z" fill="url(#pick)"/>
