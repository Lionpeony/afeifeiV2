        </svg>
        <div class="splash__word">AFEIFEI</div>
        <div class="splash__sub">少女乐队后台 · 音乐播放器</div>
      </div>

      <div class="splash__rail">

              <circle cx="33" cy="34" r="5.6" fill="#FDF7F3"/>
              <rect x="53" y="30" width="3" height="3" rx="1.2" fill="#FDF7F3" opacity=".8"/>
              <rect x="62" y="30" width="3" height="3" rx="1.2" fill="#FDF7F3" opacity=".8"/>
            </svg>

        <span class="splash__spark"></span>

      <div class="splash__bar"><i></i><b></b></div>

  <script>
    /* 首帧就把主题定对（避免亮闪），并接管启动层的退场节奏 */
    (function () {
      var root = document.documentElement;
      var S = "afeifei.v31.";
      function rd(k) { try { var v = localStorage.getItem(S + k); return v == null ? null : JSON.parse(v); } catch (e) { return null; } }
      var q;
      try { q = new URLSearchParams(location.search); } catch (e) { q = { get: function () { return null; } }; }

      var pref = q.get("theme") || rd("theme") || "light";
      var dark = pref === "dark" || (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      root.dataset.theme = dark ? "dark" : "light";
      root.style.colorScheme = dark ? "dark" : "light";
      var mo = q.get("motion") || rd("motion");
      if (mo) root.dataset.motion = mo;

      var node = document.getElementById("splash");
      if (!node) return;
      var tpl = node.cloneNode(true);

      function hide(target, started) {
        var wait = Math.max(0, 1650 - (performance.now() - started));
        setTimeout(function () {
          target.classList.add("is-done");
          setTimeout(function () { if (target.parentNode) target.parentNode.removeChild(target); }, 560);
        }, wait);
      }

      window.__bootDone = function () {};
      window.__splashReplay = function () {
        var n = tpl.cloneNode(true);
        document.body.appendChild(n);
        hide(n, performance.now());
      };

      if (q.get("boot") === "0") { node.parentNode.removeChild(node); return; }

      var t0 = performance.now(), hid = false;
      window.__bootDone = function () { if (hid) return; hid = true; hide(node, t0); };
      setTimeout(window.__bootDone, 4200);

    })();
  </script>
