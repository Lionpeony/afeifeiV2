<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'sha256-52UJ3sYcpLS5bDpKYyYvaLltawL89aTneXnhUHtw1eo='; media-src data: appmedia: appstream: https: http:; img-src 'self' data: blob: https: http:; connect-src 'self' appmedia: appstream: https: http:"
    />
    <title>Afeifei</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- 首屏启动层「开演调音」：聚光灯点亮拨片，EQ 试音循环，不等 React。动画只走 transform / opacity -->
    <div id="splash" aria-hidden="true">
      <div class="splash__inner">
        <div class="splash__stage">
          <span class="splash__halo"></span>
          <svg class="splash__pick" viewBox="0 0 48 48" width="58" height="58" aria-hidden="true">
            <path d="M24 4.6c8 0 15.2 6.4 15.2 14.3 0 8.8-8.2 16.4-12.9 20.7-1.3 1.2-3.3 1.2-4.6 0C17 35.3 8.8 27.7 8.8 18.9 8.8 11 16 4.6 24 4.6z" fill="#E8478E"/>
            <path d="M24 4.6c8 0 15.2 6.4 15.2 14.3 0 2.2-.5 4.3-1.5 6.2C33.9 18 29.4 12.7 24 4.6z" fill="#fff" opacity=".22"/>
            <g fill="#FDF7F3" opacity=".95">
              <rect x="26.8" y="16" width="2.4" height="10.4" rx="1.2"/>
              <circle cx="24.2" cy="26.8" r="4.1"/>
              <rect x="28.6" y="13.6" width="5.6" height="2.6" rx="1.3" transform="rotate(12 31.4 14.9)"/>
            </g>
          </svg>
          <div class="splash__eq">
            <i></i><i></i><i></i><i></i><i></i>
          </div>
        </div>
        <div class="splash__word"><i>A</i><i>F</i><i>E</i><i>I</i><i>F</i><i>E</i><i>I</i></div>
        <div class="splash__sub">少女乐队后台 · 音乐播放器</div>
        <div class="splash__bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script src="splash.js"></script>
    <!-- 普通脚本：产物是 iife。改成 type=module 会被 file:// 的 CORS 拦掉，页面直接空白 -->
    <script src="app.js"></script>
    <!-- 玻璃明暗开关组件（原生 ESM Web Component）。deferred：先渲染，元素在 evaluate 后自动升级 -->
    <script type="module" src="glass-toggle.js"></script>
  </body>
</html>
