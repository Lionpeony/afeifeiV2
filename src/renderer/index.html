<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; media-src appmedia: appstream: https: http:; img-src 'self' data: blob: https: http:; connect-src 'self' appmedia: appstream: https: http:"
    />
    <title>Afeifei</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- 首屏启动层：纯 HTML/CSS，不等 React。动画只走 transform / opacity -->
    <div id="splash" aria-hidden="true">
      <div class="splash__inner">
        <div class="splash__logo">
          <svg class="splash__pick" viewBox="0 0 48 48" width="58" height="58" aria-hidden="true">
            <path d="M24 4.6c8 0 15.2 6.4 15.2 14.3 0 8.8-8.2 16.4-12.9 20.7-1.3 1.2-3.3 1.2-4.6 0C17 35.3 8.8 27.7 8.8 18.9 8.8 11 16 4.6 24 4.6z" fill="#E8478E"/>
            <path d="M24 4.6c8 0 15.2 6.4 15.2 14.3 0 2.2-.5 4.3-1.5 6.2C33.9 18 29.4 12.7 24 4.6z" fill="#fff" opacity=".22"/>
            <g fill="#FDF7F3" opacity=".95">
              <rect x="26.8" y="16" width="2.4" height="10.4" rx="1.2"/>
              <circle cx="24.2" cy="26.8" r="4.1"/>
              <rect x="28.6" y="13.6" width="5.6" height="2.6" rx="1.3" transform="rotate(12 31.4 14.9)"/>
            </g>
          </svg>
          <div class="splash__word"><i>A</i><i>F</i><i>E</i><i>I</i><i>F</i><i>E</i><i>I</i></div>
          <div class="splash__sub">少女乐队后台 · 音乐播放器</div>
        </div>
        <div class="splash__rail">
          <div class="splash__slide">
            <span class="splash__ghost splash__ghost--1"></span>
            <span class="splash__ghost splash__ghost--2"></span>
            <span class="splash__guitar">
              <!-- 琴身是单条路径（真正的凹腰轮廓），琴颈/琴头同组一起转，永不散架 -->
              <svg viewBox="0 0 140 72" width="132" height="68" fill="currentColor" aria-hidden="true">
                <g transform="rotate(-6 60 36)">
                  <path d="M 71 33 C 69 24, 60 19, 54 19.5 C 49 20, 46.5 22, 44.5 23.5 C 41.5 19.5, 35 16, 27.5 16.5 C 16.5 17, 8.5 25, 9 36 C 9.5 47, 17.5 55, 27.5 55.5 C 35 56, 41.5 52.5, 44.5 48.5 C 46.5 50, 49 52, 54 52.5 C 60 53, 69 48, 71 39 Z"/>
                  <rect x="68" y="33" width="46" height="6" rx="2.5"/>
                  <rect x="112" y="28.5" width="17" height="15" rx="3.5"/>
                  <rect x="115.5" y="31.5" width="2.6" height="2.6" rx="1.3" fill="#FDF7F3" opacity=".85"/>
                  <rect x="120.5" y="31.5" width="2.6" height="2.6" rx="1.3" fill="#FDF7F3" opacity=".85"/>
                  <rect x="76" y="35" width="3" height="2.4" rx="1.2" fill="#FDF7F3" opacity=".8"/>
                  <rect x="85" y="35" width="3" height="2.4" rx="1.2" fill="#FDF7F3" opacity=".8"/>
                  <rect x="94" y="35" width="3" height="2.4" rx="1.2" fill="#FDF7F3" opacity=".8"/>
                </g>
                <circle cx="29" cy="36" r="6.5" fill="#FDF7F3"/>
                <rect x="41" y="34.6" width="4" height="2.8" rx="1.2" fill="#FDF7F3" opacity=".9"/>
              </svg>
            </span>
          </div>
          <span class="splash__spark"></span>
          <span class="splash__spark splash__spark--2"></span>
          <span class="splash__spark splash__spark--3"></span>
          <span class="splash__ring"></span>
          <span class="splash__note splash__note--1">♪</span>
          <span class="splash__note splash__note--2">♫</span>
          <span class="splash__note splash__note--3">♪</span>
        </div>
        <div class="splash__bar"><i></i><b></b></div>
      </div>
    </div>
    <div id="root"></div>
    <script src="splash.js"></script>
    <!-- 普通脚本：产物是 iife。改成 type=module 会被 file:// 的 CORS 拦掉，页面直接空白 -->
    <script src="app.js"></script>
  </body>
</html>
