<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">沉浸播放页草图</title>
  <desc id="desc">全屏深色播放界面，隐藏顶部工具栏和侧边导航，以居中的大唱片封面与环形进度为主体，底部保留播放控制。</desc>
  <style>text{font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;fill:#f2f4f8}.muted{fill:#a8b2c2}.darkline{stroke:#435062;stroke-width:1}</style>
  <rect width="1440" height="900" fill="#111827"/>
  <!-- 沉浸视图只保留退出入口，不显示常规顶部栏与侧边栏 -->
  <path d="M48 40l12 12-12 12M60 52H38" fill="none" stroke="#a8b2c2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="57" font-size="13" class="muted">退出沉浸播放</text>
  <!-- 大唱片：静止封面、细纹路和环形播放进度 -->
  <circle cx="720" cy="399" r="276" fill="none" stroke="#344153" stroke-width="1"/>
  <circle cx="720" cy="399" r="260" fill="none" stroke="#344153" stroke-width="1"/>
  <circle cx="720" cy="399" r="244" fill="none" stroke="#344153" stroke-width="1"/>
  <circle cx="720" cy="399" r="228" fill="none" stroke="#344153" stroke-width="1"/>
  <circle cx="720" cy="399" r="276" fill="none" stroke="#7edbd0" stroke-width="4" stroke-dasharray="1000 735" stroke-linecap="round" transform="rotate(-90 720 399)"/>
  <rect x="522" y="201" width="396" height="396" rx="3" fill="#334155" stroke="#f2f4f8" stroke-opacity=".38"/>
  <path d="M522 489l91-103 77 65 62-58 166 153v51H522z" fill="#657b83" opacity=".82"/>
  <circle cx="795" cy="308" r="45" fill="#a8a38a" opacity=".82"/>
  <!-- 曲目信息 -->
  <text x="720" y="684" font-size="27" font-weight="600" text-anchor="middle">歌曲名称</text>
  <text x="720" y="714" font-size="15" class="muted" text-anchor="middle">歌手名称</text>
  <!-- 极简播放控制与时间进度 -->
  <text x="514" y="770" font-size="12" class="muted" text-anchor="end">1:24</text>
  <rect x="540" y="765" width="360" height="3" rx="1.5" fill="#344153"/>
  <rect x="540" y="765" width="142" height="3" rx="1.5" fill="#7edbd0"/>
  <text x="926" y="770" font-size="12" class="muted">3:42</text>
  <g fill="none" stroke="#d7e0e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M638 811l-12-9v26l12-9zM647 802v26"/>
    <path d="M690 807l-10 8 10 8zM711 807l10 8-10 8z"/>
    <path d="M762 800l16 15-16 15z" fill="#7edbd0" stroke="#7edbd0"/>
    <path d="M812 807l10 8-10 8zM831 802v26"/>
  </g>
</svg>
