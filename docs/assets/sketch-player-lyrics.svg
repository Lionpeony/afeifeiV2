<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">普通播放页草图</title>
  <desc id="desc">浅色播放器外壳中的深色聆听舞台，左侧唱片封面和进度环，右侧歌词分区，底部为常驻播放栏。</desc>
  <style>text{font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;fill:#17232b}.muted{fill:#667680}.light{fill:#f2f4f8}.subtle{fill:#a8b2c2}.line{stroke:#d8e1df;stroke-width:1}.darkline{stroke:#435062;stroke-width:1}</style>
  <rect width="1440" height="900" fill="#f3f6f5"/>
  <!-- 顶部搜索栏 54 px -->
  <rect width="1440" height="54" fill="#fff"/><path d="M0 53.5H1440" class="line"/>
  <circle cx="28" cy="27" r="11" fill="none" stroke="#167c74" stroke-width="2"/><path d="M36 35l7 7" stroke="#167c74" stroke-width="2"/>
  <rect x="490" y="10" width="460" height="34" rx="7" fill="#f3f6f5" stroke="#d8e1df"/><circle cx="510" cy="27" r="5" fill="none" stroke="#667680" stroke-width="1.5"/><path d="M514 31l4 4" stroke="#667680" stroke-width="1.5"/><text x="528" y="32" font-size="13" class="muted">搜索歌曲、歌手或专辑</text>
  <circle cx="1380" cy="27" r="3" fill="#667680"/><circle cx="1400" cy="27" r="3" fill="#667680"/>
  <!-- 侧边导航 76 px -->
  <rect x="0" y="54" width="76" height="764" fill="#edf2f0"/><path d="M75.5 54V818" class="line"/>
  <g fill="none" stroke="#53636b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M27 91l11-9 11 9v13H27zM34 104V95h8v9"/><rect x="29" y="157" width="18" height="18" rx="3"/><path d="M32 153h12"/><path d="M29 223h18M29 230h18M29 237h12"/><circle cx="38" cy="298" r="10"/><path d="M35 295l7 3-7 3z"/><circle cx="38" cy="748" r="9"/></g>
  <rect x="8" y="204" width="60" height="48" rx="8" fill="#dcece8"/>
  <!-- 播放内容区域 -->
  <rect x="104" y="78" width="1304" height="714" rx="14" fill="#111827"/>
  <text x="150" y="128" font-size="15" class="subtle">正在播放</text>
  <!-- 左侧唱片封面与纹路进度环 -->
  <circle cx="438" cy="426" r="227" fill="none" stroke="#344153" stroke-width="1"/>
  <circle cx="438" cy="426" r="213" fill="none" stroke="#344153" stroke-width="1"/>
  <circle cx="438" cy="426" r="199" fill="none" stroke="#344153" stroke-width="1"/>
  <circle cx="438" cy="426" r="184" fill="none" stroke="#344153" stroke-width="1"/>
  <circle cx="438" cy="426" r="227" fill="none" stroke="#7edbd0" stroke-width="4" stroke-dasharray="760 667" stroke-linecap="round" transform="rotate(-90 438 426)"/>
  <rect x="282" y="270" width="312" height="312" rx="3" fill="#344354" stroke="#f2f4f8" stroke-opacity=".4"/>
  <path d="M282 502l72-79 53 48 58-60 129 121v50H282z" fill="#73858a" opacity=".8"/><circle cx="500" cy="347" r="33" fill="#a8a38a" opacity=".8"/>
  <!-- 曲目信息，位于唱片下方 -->
  <text x="438" y="632" font-size="22" font-weight="600" class="light" text-anchor="middle">歌曲名称</text>
  <text x="438" y="660" font-size="14" class="subtle" text-anchor="middle">歌手名称　·　专辑名称</text>
  <!-- 左右区隔与歌词 -->
  <path d="M754 184V672" class="darkline"/>
  <text x="811" y="235" font-size="14" class="subtle">歌词</text>
  <text x="811" y="332" font-size="18" class="subtle">上一句歌词</text>
  <text x="811" y="402" font-size="30" class="light" font-weight="600">当前歌词显示在这里</text>
  <text x="811" y="472" font-size="18" class="subtle">下一句歌词</text>
  <text x="811" y="537" font-size="18" class="subtle">后续歌词</text>
  <!-- 底部常驻播放栏 -->
  <rect x="0" y="818" width="1440" height="82" fill="#fff"/><path d="M0 818.5H1440" class="line"/>
  <rect x="20" y="835" width="48" height="48" rx="4" fill="#dce4e2"/><path d="M27 871l13-15 9 8 7-7 6 7v19H27z" fill="#a9bab7"/>
  <text x="82" y="855" font-size="14" font-weight="600">歌曲名称</text><text x="82" y="875" font-size="12" class="muted">歌手名称</text>
  <g fill="none" stroke="#53636b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M566 849l-11-8v24l11-8zM574 841v24"/><path d="M641 845l-10 8 10 8zM659 845l10 8-10 8z"/><path d="M719 841l14 11-14 11z" fill="#167c74" stroke="#167c74"/><path d="M785 845l10 8-10 8zM803 841v24"/><rect x="1260" y="847" width="15" height="12" rx="2"/><path d="M1278 851l8-5v14l-8-5zM1315 857a8 8 0 1 0-2-8M1313 846v5h5"/></g>
  <text x="532" y="875" font-size="11" class="muted" text-anchor="end">1:24</text><rect x="548" y="877" width="340" height="3" rx="1.5" fill="#dce5e3"/><rect x="548" y="877" width="126" height="3" rx="1.5" fill="#167c74"/><text x="904" y="875" font-size="11" class="muted">3:42</text><path d="M1223 847v16M1215 855h16" stroke="#53636b" stroke-width="1.5"/>
</svg>
