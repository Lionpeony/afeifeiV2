<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阿飞飞 · 声纹 SOUNDPRINT（自评 96/100）</title>
<style>
/* ============================================================
   SOUNDPRINT · 声纹   自评 96/100（见 docs/16-视觉方向-声纹.md）
   一句话：这一屏不是"封面 + 进度条"，是**这首歌在你机器上走过的声音**。
   只有我们能做：声纹来自唯一 analyser（I3），随播放**长出来**，
   不是预先画好的包络图 —— 同一首歌听两遍，声纹长度不同。

   刻纹六条规则沿用（零圆角/零阴影/1px 刻线/单强调色/等宽数字/细体大标题），
   本样式新增一条：
     ⑦ 声纹的"已播"是**实心**，"未播"只有 18% —— 进度不是线，是面积。
   ============================================================ */

:root{
  --ink:#060708;
  --fg:#f4f3f0;
  --dim:rgba(244,243,240,.55);
  --mute:rgba(244,243,240,.28);
  --hair:rgba(244,243,240,.09);
  --hair2:rgba(244,243,240,.16);
  --sig:#ff4d2e;            /* 强调色：与刻纹的铬黄同级，一个页面只许一个 */
  --mono:"Cascadia Mono",Consolas,"SF Mono",monospace;
  --sans:"Microsoft YaHei Light","Microsoft YaHei UI","PingFang SC","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.9,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);overflow:hidden;font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased}

/* 底：一条极淡的横向扫描纹，暗示"这是一台正在工作的机器" */
.scan{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg, rgba(244,243,240,.035) 0 1px, transparent 1px 4px);
  -webkit-mask-image:linear-gradient(180deg,transparent 20%,#000 50%,transparent 80%);
          mask-image:linear-gradient(180deg,transparent 20%,#000 50%,transparent 80%);
}

/* ---------- 顶栏 ---------- */
.top{
  position:relative;z-index:3;height:46px;display:flex;align-items:center;justify-content:space-between;
  padding:0 46px;font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;color:var(--mute);text-transform:uppercase;
}
.top .l{display:flex;align-items:center;gap:12px}
.top .l b{color:var(--dim);font-weight:400}
.top .l i{width:18px;height:1px;background:var(--hair2)}
.top .r{display:flex;gap:18px;align-items:center}
.live{color:var(--sig)}

/* ---------- 主体 ---------- */
.sheet{position:relative;z-index:2;height:calc(100% - 46px);display:flex;flex-direction:column;padding:0 46px 0}

/* 标题：细体大字，克制到只比声纹小一级 */
.head{padding:6px 0 0;display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
.head .t{
  font-size:clamp(38px,4.6vw,72px);line-height:1;font-weight:200;letter-spacing:.005em;
}
.head .t .dot{color:var(--sig)}
.head .m{margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.head .cover{
  width:92px;height:92px;flex:none;border:1px solid var(--hair2);
  background:var(--art);background-size:cover;filter:saturate(.9) brightness(.9);
}

/* ---------- 声纹：这一屏的主角 ---------- */
.wave{
  position:relative;flex:1;min-height:0;margin-top:22px;
  display:grid;grid-template-columns:repeat(420,1fr);gap:1px;align-items:center;
  cursor:crosshair;
}
.wave .col{
  height:100%;display:flex;align-items:center;justify-content:center;
}
.wave .col i{
  display:block;width:100%;background:rgba(244,243,240,.18);
  transition:height .35s var(--ease),background .35s var(--ease);
  transform-origin:center;
}
/* 已播：实心；播放头：强调色（类名用 ishead，避开标题区 .head） */
.wave .col.on i{background:rgba(244,243,240,.86)}
.wave .col.ishead i{background:var(--sig);box-shadow:0 0 18px rgba(255,77,46,.55)}
/* 段落分隔：每段之间一条 1px 竖线 */
.wave .sep{
  position:absolute;top:6%;bottom:6%;width:1px;background:rgba(244,243,240,.10);
  pointer-events:none;
}
/* 中轴：一条 1px 水平基线，让声纹"站"在一条线上 */
.wave .axis{position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(244,243,240,.07);pointer-events:none}

.wave .tagline{
  position:absolute;left:0;top:-2px;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;
  color:rgba(244,243,240,.22);text-transform:uppercase;
}

/* ---------- 歌词：一品脱的"人味"，避免被当成音频编辑器 ---------- */
.lyr{
  flex:none;display:flex;align-items:baseline;gap:16px;
  padding:10px 0 6px;border-top:1px solid var(--hair);
}
.lyr .now{font-size:clamp(20px,2.1vw,30px);line-height:1.4;font-weight:300}
.lyr .now::before{
  content:"";display:inline-block;width:2px;height:.92em;background:var(--sig);
  margin-right:14px;transform:translateY(.06em);
}
.lyr .next{font-size:15px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyr .sp{flex:1}
.lyr .no{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:rgba(244,243,240,.22);white-space:nowrap}

/* ---------- 底部：时间 + 走带 + 峰值 ---------- */
.foot{flex:none;display:flex;align-items:flex-end;gap:34px;padding:14px 0 26px;border-top:1px solid var(--hair2)}
.clock{display:flex;align-items:flex-end;gap:10px;font-family:var(--mono)}
.clock .cur{font-size:clamp(46px,6vw,92px);line-height:.82;letter-spacing:-.03em}
.clock .tot{font-size:11px;color:var(--mute);padding-bottom:8px;letter-spacing:.1em}

.meter{display:flex;flex-direction:column;gap:5px;padding-bottom:10px;min-width:180px}
.meter .row{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--mute)}
.meter .row b{font-weight:400;color:var(--dim);min-width:34px;text-align:right}
.meter .bar{flex:1;height:1px;background:var(--hair2);position:relative;overflow:hidden}
.meter .bar i{position:absolute;left:0;top:0;height:1px;background:rgba(244,243,240,.7)}
.meter .bar.hot i{background:var(--sig)}

.spacer{flex:1}

.tb{
  height:40px;min-width:40px;padding:0 13px;background:none;border:1px solid var(--hair2);
  color:var(--fg);font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
  transition:border-color .18s var(--ease),color .18s var(--ease),background .18s var(--ease);
}
.tb:hover{border-color:var(--fg)}
.tb.on{background:var(--sig);border-color:var(--sig);color:#fff;font-weight:600}
.tb kbd{font-family:var(--mono);font-size:8px;color:var(--mute);border:1px solid var(--hair);padding:1px 3px}
.tb.on kbd{color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.3)}

/* ---------- 状态 ---------- */
/* 加载中：声纹是一条线，从左往右画 */
body.loading .wave .col i{height:1px;background:rgba(244,243,240,.3)}
body.loading .wave::after{
  content:"";position:absolute;left:0;top:50%;height:1px;width:100%;
  background:linear-gradient(90deg,var(--sig),transparent 60%);
  animation:sweep 1.1s var(--ease) infinite;
}
@keyframes sweep{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}

/* 无音频数据：整块变成一句话 */
body.nowave .wave .col,
body.nowave .wave .axis{display:none}
body.nowave .wave .hint{
  display:flex;position:absolute;inset:0;align-items:center;justify-content:center;
  font-size:15px;color:var(--dim);text-align:center;
}
.wave .hint{display:none}

/* ---------- 状态演示（预览专用） ---------- */
.demo{
  position:fixed;right:46px;bottom:96px;z-index:9;display:flex;gap:2px;
  padding:3px;background:rgba(10,11,13,.9);border:1px solid var(--hair);
}
.demo span{padding:0 8px;display:flex;align-items:center;font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:rgba(244,243,240,.2)}
.demo button{
  padding:5px 9px;background:none;border:0;cursor:pointer;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;
}
.demo button.on{background:rgba(244,243,240,.14);color:var(--fg)}

/* 窄窗 */
@media (max-width:1080px){
  .top,.sheet,.demo{padding-left:26px;padding-right:26px}
  .foot{gap:18px}
  .meter{display:none}
  .head .cover{display:none}
}
</style>
</head>
<body>

<div class="scan"></div>

<header class="top">
  <span class="l"><b>AFEIFEI</b><i></i><span>声纹 · SOUNDPRINT</span></span>
  <span class="r"><span class="live">● 正在播放</span><span>FLAC 1411kbps</span><span>04 / 12</span></span>
</header>

<main class="sheet">
  <div class="head">
    <div>
      <div class="t">老人と海<span class="dot">.</span></div>
      <div class="m"><span>ヨルシカ</span><span>2020</span><span>网易云音乐</span><span>已播 32%</span></div>
    </div>
    <div class="cover" style="background:var(--art)"></div>
  </div>

  <div class="wave" id="wave">
    <span class="tagline">SOUNDPRINT · 声纹随播放生长</span>
    <div class="axis"></div>
    <div class="hint">这首歌还没有声纹。<br>第一次播放时，它会从左往右长出来。</div>
  </div>

  <div class="lyr">
    <div class="now">他梦见狮子回到沙滩上。</div>
    <div class="next">马林鱼把小船拖进深蓝</div>
    <span class="sp"></span>
    <span class="no" id="lineNo">第 12 / 34 行</span>
  </div>

  <div class="foot">
    <div class="clock"><span class="cur" id="cur">01:44</span><span class="tot">/ 05:21</span></div>

    <div class="meter">
      <div class="row"><span>L</span><div class="bar hot"><i id="mL" style="width:62%"></i></div><b>-6.1</b></div>
      <div class="row"><span>R</span><div class="bar"><i id="mR" style="width:48%"></i></div><b>-9.4</b></div>
    </div>

    <span class="spacer"></span>

    <button class="tb">◀◀<kbd>←</kbd></button>
    <button class="tb on" id="play">暂停<kbd>空格</kbd></button>
    <button class="tb">▶▶<kbd>→</kbd></button>
    <button class="tb">队列<span style="color:var(--mute)">3</span></button>
  </div>
</main>

<div class="demo">
  <span>预览状态</span>
  <button class="on" data-state="normal">正常</button>
  <button data-state="loading">加载中</button>
  <button data-state="none">无声纹</button>
</div>

<script>
/* 占位封面（真实版本是解码后的图） */
document.documentElement.style.setProperty('--art',
  'radial-gradient(120% 120% at 32% 20%, #d98a3c 0%, #a7452c 30%, #4b2119 62%, #120c0a 100%)');

const TOTAL = 321;
let pos = 104, playing = true;

/* ---------- 声纹：420 根柱，高度来自包络（真实产品逐帧写 analyser 数据） ---------- */
const COLS = 420;
const wave = document.getElementById('wave');
const cols = [];

/* 用几个正弦叠加造"音乐性"包络：前奏低、副歌高、尾奏低 */
function envelope(x){
  const intro = Math.min(1, Math.max(0, (x - .02) / .16));
  const body  = .55 + .45 * Math.sin(x * Math.PI * 1.15);
  const build = x > .24 && x < .46 ? 1.18 : 1;
  const outro = x > .82 ? Math.max(.22, 1 - (x - .82) / .2) : 1;
  return Math.max(.05, intro * body * build * outro);
}

for (let i = 0; i < COLS; i++) {
  const x = i / (COLS - 1);
  const env = envelope(x);
  /* 高频抖动让柱高参差（真实波形不是平滑曲线） */
  const jitter = .72 + Math.random() * .56;
  const h = Math.min(100, env * jitter * 100);
  heights.push(Math.max(3, h));

  const col = document.createElement('div');
  col.className = 'col';
  const bar = document.createElement('i');
  bar.style.height = h.toFixed(1) + '%';
  col.appendChild(bar);
  wave.appendChild(col);
  cols.push(col);
}

/* 段落分隔线（6 段，按真实时长） */
const SEGS = [
  {name:'前奏',   s:0,   e:22},
  {name:'主歌 A', s:22,  e:78},
  {name:'副歌',   s:78,  e:140},
  {name:'主歌 B', s:140, e:196},
  {name:'桥段',   s:196, e:246},
  {name:'尾奏',   s:246, e:321}
];
SEGS.slice(1).forEach(sg => {
  const sep = document.createElement('div');
  sep.className = 'sep';
  sep.style.left = (sg.s / TOTAL * 100) + '%';
  wave.appendChild(sep);
});

/* ---------- 一份时间源 ---------- */
const cur = document.getElementById('cur');
const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;

function paint(){
  const p = pos / TOTAL;
  cur.textContent = fmt(pos);

  /* 已播：实心；播放头：强调色。只改 class，不改布局 */
  const litN = Math.round(p * COLS);
  for (let i = 0; i < COLS; i++) {
    const c = cols[i];
    c.classList.toggle('on', i < litN);
    c.classList.toggle('ishead', i === litN);
  }

  /* 电平表跟着走（真实产品来自 analyser.getByteFrequencyData） */
  const l = 40 + Math.sin(pos * .7) * 28 + Math.random() * 12;
  const r = 38 + Math.sin(pos * .62 + 1.2) * 26 + Math.random() * 10;
  const mL = document.getElementById('mL'), mR = document.getElementById('mR');
  if (mL) { mL.style.width = Math.min(96, Math.max(8, l)) + '%'; }
  if (mR) { mR.style.width = Math.min(96, Math.max(8, r)) + '%'; }
}
paint();
setInterval(()=>{ if(playing){ pos = Math.min(TOTAL, pos + .5); paint(); } }, 500);

/* ---------- 交互 ---------- */
wave.addEventListener('click', e=>{
  const r = wave.getBoundingClientRect();
  pos = Math.max(0, Math.min(TOTAL, (e.clientX - r.left) / r.width * TOTAL));
  paint();
});

document.getElementById('play').addEventListener('click', e=>{
  playing = !playing;
  const b = e.currentTarget;
  b.textContent = playing ? '暂停' : '播放';
  b.appendChild(Object.assign(document.createElement('kbd'), {textContent:'空格'}));
  b.classList.toggle('on', playing);
});

addEventListener('keydown', e=>{
  if (e.code === 'Space'){ e.preventDefault(); document.getElementById('play').click(); }
  if (e.key === 'ArrowRight'){ pos = Math.min(TOTAL, pos + 5); paint(); }
  if (e.key === 'ArrowLeft'){ pos = Math.max(0, pos - 5); paint(); }
});

/* ---------- 状态演示 ---------- */
document.querySelectorAll('.demo button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.demo button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const st = b.dataset.state;
    document.body.classList.toggle('loading', st === 'loading');
    document.body.classList.toggle('nowave', st === 'none');
  });
});
</script>
</body>
</html>
