<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阿飞飞 · 全站八页</title>
<style>
/* ============================================================
   八页 · 一套纪律 + 八个母题
   共享：纸底 / 墨 / 朱砂 / 1px 线 / 等宽数字 / 细体大字 / 零圆角零阴影
   母题：海报 · 档案柜 · 检索台 · 工单 · 票根墙 · 时间轴 · 账本 · 配电盘
   ============================================================ */
:root{
  --paper:#f3f1ea; --paper2:#ece9df; --paper3:#e4e0d4;
  --ink:#17150f; --ink2:rgba(23,21,15,.78); --ink3:rgba(23,21,15,.46); --ink4:rgba(23,21,15,.26);
  --hair:rgba(23,21,15,.16); --hair2:rgba(23,21,15,.09);
  --red:#d8341c;
  --serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  --sans:"Microsoft YaHei Light","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ---------- 左导航（八页共用外壳） ---------- */
nav{position:fixed;left:0;top:0;bottom:0;width:74px;border-right:1px solid var(--ink);
  display:flex;flex-direction:column;align-items:center;padding:16px 0;z-index:20}
nav .logo{writing-mode:vertical-rl;font:600 13px/1.2 var(--serif);letter-spacing:.14em;margin-bottom:12px}
nav .logo small{display:block;font:400 8px/1 var(--mono);letter-spacing:.22em;color:var(--ink3);margin-top:8px}
nav button{writing-mode:vertical-rl;padding:9px 5px;font:inherit;font-size:12px;letter-spacing:.16em;
  color:var(--ink3);background:none;border:0;cursor:pointer;position:relative}
nav button.on{color:var(--ink)}
nav button.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;background:var(--red)}
nav .sp{flex:1}

.shell{margin-left:74px;height:100%;display:flex;flex-direction:column}
.head{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 36px;border-bottom:1px solid var(--ink);
  font:400 10.5px/1 var(--mono);letter-spacing:.16em;color:var(--ink3);text-transform:uppercase}
.head b{color:var(--ink);font-weight:400}
.head .r{display:flex;gap:18px;align-items:center}
.view{flex:1;min-height:0;position:relative;overflow:hidden}
/* 每次 render 只放一个 section，直接可见（原来靠 .on 控制，导致其余页全白） */
.view>section{position:absolute;inset:0;opacity:1;visibility:visible}

/* 通用零件 */
.kicker{display:flex;align-items:center;gap:9px;font:400 9px/1 var(--mono);letter-spacing:.22em;color:var(--ink3);text-transform:uppercase}
.kicker i{width:16px;height:1px;background:var(--ink4)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font:200 clamp(34px,4.4vw,62px)/1 var(--serif);letter-spacing:.005em}
.mid{font:200 clamp(22px,2.6vw,34px)/1.1 var(--serif)}
.tag{font:400 8.5px/1 var(--mono);letter-spacing:.14em;color:var(--ink3);border:1px solid var(--hair2);padding:3px 5px;text-transform:uppercase}
.red{color:var(--red)}
.live{position:relative}
.live::before{content:"";position:absolute;left:-9px;top:6px;bottom:6px;width:2px;background:var(--red)}

/* ================= 01 首页 · 每日海报 ================= */
.home{display:grid;grid-template-columns:minmax(0,60%) minmax(0,40%);height:100%}
.poster{position:relative;overflow:hidden;background:var(--art) center/cover no-repeat}
.poster::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(23,21,15,.06) 0%,rgba(23,21,15,.14) 46%,rgba(23,21,15,.72) 82%,rgba(23,21,15,.92) 100%)}
.poster .ph{position:absolute;left:34px;right:34px;bottom:26px;z-index:2}
.poster .ph .kk{font:400 9px/1 var(--mono);letter-spacing:.26em;color:#fff;opacity:.72;text-transform:uppercase}
.poster .ph h1{margin:12px 0 0;font:200 clamp(58px,8.4vw,124px)/.86 var(--serif);letter-spacing:-.03em;color:#fff;
  text-shadow:4px 4px 0 rgba(216,52,28,.42),0 2px 60px rgba(0,0,0,.5);text-wrap:balance}
.poster .ph .why{margin-top:16px;display:inline-flex;gap:10px;align-items:baseline;padding:7px 11px;
  background:rgba(243,241,234,.9);border-left:2px solid var(--red)}
.poster .ph .why b{font:400 9px/1 var(--mono);letter-spacing:.18em;color:var(--red)}
.poster .ph .why span{font-size:13.5px;color:var(--ink2)}
.poster .crop{position:absolute;inset:12px;z-index:3;pointer-events:none}
.poster .crop i{position:absolute;width:12px;height:12px}
.poster .crop i::before,.poster .crop i::after{content:"";position:absolute;background:rgba(255,255,255,.5)}
.poster .crop i::before{left:0;top:5px;width:12px;height:1px}
.poster .crop i::after{left:5px;top:0;width:1px;height:12px}
.poster .crop i:nth-child(1){left:0;top:0}.poster .crop i:nth-child(2){right:0;top:0}
.poster .crop i:nth-child(3){left:0;bottom:0}.poster .crop i:nth-child(4){right:0;bottom:0}
.prog{display:flex;flex-direction:column;border-left:1px solid var(--ink)}
.prog .ph2{display:flex;justify-content:space-between;align-items:baseline;padding:18px 30px 12px;border-bottom:1px solid var(--hair)}
.prog .ph2 b{font:200 30px/1 var(--serif)}
.prog .list{flex:1;overflow:hidden;padding:0 30px}
.prog .it{display:grid;grid-template-columns:26px minmax(0,1fr) 44px;gap:10px;align-items:center;
  height:47px;border-bottom:1px solid var(--hair2)}
.prog .it .n{font:400 10px/1 var(--mono);color:var(--ink3)}
.prog .it .t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.prog .it .t small{display:block;font:400 10px/1.3 var(--mono);letter-spacing:.08em;color:var(--ink4);margin-top:2px}
.prog .it time{font:400 10.5px/1 var(--mono);color:var(--ink3);text-align:right}
.prog .it.on .t{color:var(--ink);font-weight:500}
.prog .it.on .n{color:var(--red)}
.prog .ft{padding:14px 30px;border-top:1px solid var(--ink);display:flex;align-items:center;gap:16px;
  font:400 10px/1 var(--mono);letter-spacing:.12em;color:var(--ink3)}
.prog .ft b{color:var(--ink);font-weight:400}
.prog .ft .go{margin-left:auto;background:var(--red);color:#fff;border:0;padding:9px 15px;
  font:400 9.5px/1 var(--mono);letter-spacing:.18em;cursor:pointer;text-transform:uppercase}

/* ================= 02 本地 · 档案柜 ================= */
.local{display:flex;flex-direction:column;height:100%;padding:22px 36px}
.local .bar{display:flex;align-items:center;gap:20px;margin-bottom:16px}
.local .bar .sp{flex:1}
.local .tabs{display:flex;gap:0;border:1px solid var(--ink)}
.local .tabs button{background:none;border:0;padding:7px 15px;font:400 10px/1 var(--mono);letter-spacing:.16em;
  color:var(--ink3);cursor:pointer;text-transform:uppercase}
.local .tabs button.on{background:var(--ink);color:var(--paper)}
.cards{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px;align-content:start;overflow:hidden}
.card{position:relative;border:1px solid var(--hair);background:var(--paper2);padding:12px 13px 14px}
.card::before{content:"";position:absolute;left:11px;top:-1px;bottom:-1px;width:1px;background:var(--red);opacity:0}
.card.live::before{opacity:1}
.card .no{font:400 9px/1 var(--mono);letter-spacing:.16em;color:var(--ink4)}
.card .cv{height:96px;margin:9px 0 10px;background:var(--art) center/cover;filter:grayscale(.18) contrast(.98)}
.card .t{font:400 13.5px/1.3 var(--sans);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .b{margin-top:4px;font:400 10px/1 var(--mono);letter-spacing:.08em;color:var(--ink3)}
.card .m{margin-top:7px;display:flex;justify-content:space-between;align-items:baseline;
  font:400 9.5px/1 var(--mono);color:var(--ink4)}
.card.live .t{font-weight:600}

/* ================= 03 在线 · 检索台 ================= */
.onl{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:34px;height:100%;padding:26px 36px}
.onl .q{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--ink);padding-bottom:12px}
.onl .q input{flex:1;background:none;border:0;outline:0;font:200 34px/1 var(--serif);color:var(--ink)}
.onl .q .btn{font:400 9.5px/1 var(--mono);letter-spacing:.2em;color:var(--ink3);border:1px solid var(--hair);padding:8px 12px;cursor:pointer}
.work{margin-top:24px}
.work .wk{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.work .wk h2{font:200 44px/1 var(--serif)}
.work .wk .meta{font:400 10px/1.8 var(--mono);letter-spacing:.14em;color:var(--ink3);text-align:right}
.vers{margin-top:18px;border-top:1px solid var(--ink)}
.vers .v{display:grid;grid-template-columns:150px minmax(0,1fr) 84px 70px;gap:14px;align-items:center;
  padding:13px 0;border-bottom:1px solid var(--hair2)}
.vers .v .src{font:400 10px/1 var(--mono);letter-spacing:.14em;color:var(--ink3)}
.vers .v .t{font-size:15px;color:var(--ink2)}
.vers .v .q2{font:400 10.5px/1 var(--mono);color:var(--ink3);text-align:right}
.vers .v .go{font:400 9px/1 var(--mono);letter-spacing:.16em;border:1px solid var(--hair);padding:6px 8px;cursor:pointer;text-align:center}
.vers .v.ok .go{border-color:var(--red);color:var(--red)}
.vers .v.ok .src{color:var(--red)}
.aside{border-left:1px solid var(--ink);padding-left:26px}
.aside .ah{font:400 9px/1 var(--mono);letter-spacing:.2em;color:var(--ink3);padding-bottom:9px;border-bottom:1px solid var(--hair)}
.aside .a{margin-top:14px}
.aside .a .n{font:400 9px/1 var(--mono);letter-spacing:.16em;color:var(--ink4)}
.aside .a .t{font:400 15px/1.3 var(--sans);color:var(--ink);margin-top:5px}
.aside .a .w{font:400 10.5px/1.6 var(--mono);color:var(--ink3);margin-top:8px}
.aside .a .w b{color:var(--ink);font-weight:600}

/* ================= 04 下载 · 工单 ================= */
.dl{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:34px;height:100%;padding:26px 36px}
.tk{display:flex;flex-direction:column;gap:0}
.tk .row{display:grid;grid-template-columns:22px minmax(0,1fr) 92px 132px 84px;gap:12px;align-items:center;
  padding:13px 0;border-bottom:1px solid var(--hair2)}
.tk .row .st{width:9px;height:9px;border-radius:50%;background:var(--ink4)}
.tk .row.done .st{background:var(--ink)}
.tk .row.run .st{background:var(--red)}
.tk .row .t{font-size:14.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .row .sz{font:400 11px/1 var(--mono);color:var(--ink3);text-align:right}
.tk .row .pg{position:relative;height:2px;background:var(--hair)}
.tk .row .pg i{position:absolute;left:0;top:0;height:2px;background:var(--ink)}
.tk .row.run .pg i{background:var(--red)}
.tk .row .ac{font:400 9px/1 var(--mono);letter-spacing:.14em;color:var(--ink4);text-align:right}
.tk .row .ac b{color:var(--red);font-weight:400}
.policy{border-left:1px solid var(--ink);padding-left:26px}
.policy h3{font:200 26px/1 var(--serif)}
.policy .f{margin-top:16px}
.policy .f .fl{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--hair2);
  font:400 11px/1 var(--mono);letter-spacing:.1em;color:var(--ink3)}
.policy .f .fl b{color:var(--ink);font-weight:400;font-size:12px}
.policy .note{margin-top:20px;padding:13px 14px;background:var(--paper2);border-left:2px solid var(--red);font-size:13.5px;line-height:1.6;color:var(--ink2)}

/* ================= 05 红心 · 藏票夹 ================= */
.lv{display:flex;flex-direction:column;height:100%;padding:22px 36px}
.lv .hd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.lv .hd .big{font-size:clamp(30px,3.6vw,46px)}
.tickets{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:18px;align-content:start;overflow:hidden}
.tk2{position:relative;border:1px solid var(--hair);background:var(--paper2);padding:13px 14px 15px;transform:rotate(-.6deg)}
.tk2:nth-child(3n){transform:rotate(.7deg)}
.tk2:nth-child(4n){transform:rotate(-1.1deg)}
.tk2::before{content:"";position:absolute;left:0;right:0;top:-1px;height:3px;
  background:repeating-linear-gradient(90deg,var(--paper) 0 4px,transparent 4px 8px)}
.tk2 .h{display:flex;justify-content:space-between;align-items:baseline;font:400 8.5px/1 var(--mono);letter-spacing:.16em;color:var(--ink4)}
.tk2 .t{margin-top:9px;font:400 15px/1.3 var(--sans);color:var(--ink)}
.tk2 .b{margin-top:4px;font:400 10.5px/1 var(--mono);letter-spacing:.08em;color:var(--ink3)}
.tk2 .why2{margin-top:11px;padding-top:9px;border-top:1px dotted var(--hair);font-size:12.5px;line-height:1.5;color:var(--ink2)}
.tk2 .why2 b{color:var(--red);font-weight:600}

/* ================= 06 最近 · 唱针时间机 ================= */
.rc{display:flex;flex-direction:column;height:100%;padding:20px 36px 24px}
.tl{position:relative;flex:none;padding:30px 0 14px}
.tl .axis{position:absolute;left:0;right:0;top:52px;height:1px;background:var(--ink)}
.tl .day{position:absolute;top:0;transform:translateX(-50%);text-align:center}
.tl .day .d{font:400 9.5px/1 var(--mono);letter-spacing:.1em;color:var(--ink4)}
.tl .day .m{width:1px;height:16px;background:var(--hair);margin:9px auto 0}
.tl .day.on .d{color:var(--red)}
.tl .day.on .m{background:var(--red);height:22px}
.tl .day.now .d{color:var(--ink);font-weight:700}
.tl .play{position:absolute;top:38px;left:32%;width:1px;height:30px;background:var(--red)}
.tl .play::after{content:"";position:absolute;left:-4px;bottom:-7px;width:9px;height:9px;background:var(--red)}
.day2{margin-top:10px;flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 26px;align-content:start;overflow:hidden}
.day2 .r{display:grid;grid-template-columns:46px minmax(0,1fr) 48px;gap:10px;align-items:center;height:64px;border-bottom:1px solid var(--hair2)}
.day2 .r .tm{font:400 10.5px/1 var(--mono);color:var(--ink3)}
.day2 .r .t{font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day2 .r time{font:400 10.5px/1 var(--mono);color:var(--ink4);text-align:right}

/* ================= 07 报告 · 会话账本 ================= */
.rp{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:34px;height:100%;padding:26px 36px}
.ledger{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ink)}
.ledger .c{padding:16px 16px 18px;border-right:1px solid var(--hair)}
.ledger .c:last-child{border-right:0}
.ledger .c .k{font:400 9px/1 var(--mono);letter-spacing:.18em;color:var(--ink3);text-transform:uppercase}
.ledger .c .v{margin-top:10px;font:200 34px/1 var(--serif)}
.ledger .c .v small{font-size:13px;color:var(--ink3);margin-left:5px}
.bars{margin-top:22px}
.bars .bh{display:flex;justify-content:space-between;padding-bottom:9px;border-bottom:1px solid var(--ink);
  font:400 9.5px/1 var(--mono);letter-spacing:.18em;color:var(--ink3)}
.bars .b2{display:grid;grid-template-columns:74px minmax(0,1fr) 62px;gap:14px;align-items:center;height:34px;border-bottom:1px solid var(--hair2)}
.bars .b2 .h2{font:400 10px/1 var(--mono);letter-spacing:.1em;color:var(--ink3)}
.bars .b2 .tr{position:relative;height:9px;background:var(--paper2)}
.bars .b2 .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bars .b2 .tr i.hot{background:var(--red)}
.bars .b2 .v2{font:400 11px/1 var(--mono);color:var(--ink2);text-align:right}
.ticket{margin-top:16px;border:1px solid var(--ink);background:var(--paper2);padding:14px 15px 16px;position:relative}
.ticket::after{content:"";position:absolute;left:0;right:0;top:-1px;height:5px;
  background:repeating-linear-gradient(90deg,var(--paper) 0 5px,transparent 5px 10px)}
.ticket .th{display:flex;justify-content:space-between;font:400 8.5px/1 var(--mono);letter-spacing:.16em;color:var(--ink4)}
.ticket .tt{margin-top:10px;font:200 25px/1.1 var(--serif)}
.ticket .tm{margin-top:9px;font:400 10.5px/1.7 var(--mono);color:var(--ink3)}
.ticket .code{margin-top:12px;display:flex;justify-content:space-between;align-items:center;
  font:400 10px/1 var(--mono);letter-spacing:.14em;color:var(--ink3);border-top:1px dotted var(--hair);padding-top:10px}
.ticket .code b{color:var(--red);font-weight:400}

/* ================= 08 设置 · 配电盘 ================= */
.st{display:grid;grid-template-columns:212px minmax(0,1fr);gap:36px;height:100%;padding:24px 36px}
.stnav{border-right:1px solid var(--hair);padding-right:22px}
.stnav button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 0;
  font:400 12.5px/1 var(--sans);color:var(--ink3);cursor:pointer;border-bottom:1px solid var(--hair2)}
.stnav button.on{color:var(--ink);font-weight:600}
.stnav button.on::before{content:"";display:inline-block;width:2px;height:11px;background:var(--red);margin-right:9px;vertical-align:-1px}
.stmain{overflow:hidden}
.grp{margin-bottom:26px}
.grp > h3{font:400 9px/1 var(--mono);letter-spacing:.22em;color:var(--ink3);text-transform:uppercase;
  padding-bottom:9px;border-bottom:1px solid var(--ink)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:24px;align-items:center;padding:14px 0;border-bottom:1px solid var(--hair2)}
.row2 .l .t{font-size:14px;color:var(--ink)}
.row2 .l .d{margin-top:4px;font-size:12px;color:var(--ink3);line-height:1.5}
.row2 .r2{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.sw{width:42px;height:20px;border:1px solid var(--ink);position:relative;cursor:pointer;background:var(--paper)}
.sw i{position:absolute;top:1px;left:1px;width:16px;height:16px;background:var(--ink);transition:.18s var(--ease)}
.sw.on{background:var(--red);border-color:var(--red)}
.sw.on i{left:23px;background:var(--paper)}
.pick2{font:400 11px/1 var(--mono);letter-spacing:.12em;color:var(--ink);border:1px solid var(--hair);padding:8px 11px;cursor:pointer;background:var(--paper)}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.g6{border:1px solid var(--hair);padding:11px 12px;background:var(--paper2);cursor:pointer}
.g6 .n{font:400 8.5px/1 var(--mono);letter-spacing:.16em;color:var(--ink4)}
.g6 .t{margin-top:7px;font:200 20px/1.1 var(--serif)}
.g6.on{border-color:var(--red);background:var(--paper)}
.g6.on .n{color:var(--red)}

@media (max-width:1180px){
  .home,.onl,.dl,.rp{grid-template-columns:1fr}
  .poster{display:none}
  .st{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav id="switch">
  <div class="logo">AFEIFEI<small>会听的播放器</small></div>
  <button class="on" data-v="home">首页</button>
  <button data-v="local">本地</button>
  <button data-v="onl">在线</button>
  <button data-v="dl">下载</button>
  <button data-v="lv">红心</button>
  <button data-v="rc">最近</button>
  <button data-v="rp">报告</button>
  <button data-v="st">设置</button>
  <div class="sp"></div>
</nav>

<div class="shell">
  <div class="head">
    <span id="crumb"><b>AFEIFEI</b> · 首页</span>
    <span class="r" id="hr"></span>
  </div>
  <div class="view" id="view"></div>
</div>

<script>
/* ---------- 数据 ---------- */
const NOW = '2026.11.03';
const LINES = [
  ['01','老人と海','ヨルシカ','5:21','网易云',true],
  ['02','打上花火','Daoko / 米津玄師','4:28','网易云',false],
