<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 刻纹钟 · DIAL</title>
<style>
/* ============================================================
   03 刻纹钟 · DIAL
   核心：一张盘压着三层时间信息，指针读谱。
     外环 60 刻 = 时间（已播变亮）
     中环 6 弧 = 段落（弧长=真实时长，当前段橙红）
     内环 34 点 = 歌词（一句一点，已播亮、当前橙红）
     指针       = 从盘外指向内环当前点，针旁显示剩余

   六层信息：顶栏 / 曲目块 / 歌词 / 时间+结构 / 队列 / 走带+技术行
   纪律：零圆角（圆只属唱片）/ 零阴影 / 1px 线 / 单强调色 #ff5a2e
   ============================================================ */

:root{
  --ink:#07080a;
  --fg:#f4f3f0;
  --dim:rgba(244,243,240,.68);
  --mute:rgba(244,243,240,.46);
  --hair:rgba(244,243,240,.13);
  --trace:rgba(244,243,240,.20);
  --sig:#ff5a2e;
  --mono:"Cascadia Mono",Consolas,"SF Mono",monospace;
  --sans:"Microsoft YaHei Light","Microsoft YaHei UI","PingFang SC","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.9,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);overflow:hidden;font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased}

/* ---------- 入场序列（5 段，第 2 轮补） ---------- */
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.rz1{animation:rise .55s var(--ease) both}
.rz2{animation:rise .55s var(--ease) .08s both}
.rz3{animation:rise .55s var(--ease) .16s both}
.rz4{animation:rise .55s var(--ease) .24s both}
.rz5{animation:fade .6s var(--ease) .3s both}

/* ---------- 顶栏 ---------- */
.top{
  height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 48px;font-family:var(--mono);font-size:8.5px;letter-spacing:.24em;
  color:var(--mute);text-transform:uppercase;
}
.top b{color:var(--dim);font-weight:400}
.top .r{display:flex;gap:16px;align-items:center}
.live{color:var(--sig)}

/* ---------- 主栅格：盘切出右缘，文字压上去 ---------- */
.stage{
  position:relative;height:calc(100% - 44px);
  padding:0 48px;overflow:hidden;
}

/* ---------- 左栏 ---------- */
.left{
  position:relative;z-index:2;width:65%;height:100%;
  display:flex;flex-direction:column;justify-content:center;min-width:0;
}
/* 曲名压到唱片左缘上：层次由"叠"产生，不靠装饰 */
.left h1{position:relative;z-index:3}

.kick{display:flex;align-items:center;gap:11px;font-family:var(--mono);font-size:8.5px;letter-spacing:.24em;color:var(--mute)}
.kick i{width:22px;height:1px;background:var(--trace)}

h1{margin:22px 0 0;font-size:clamp(48px,5.8vw,94px);line-height:.92;font-weight:200;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--sig)}

.meta{margin-top:12px;font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}

.lyric{margin-top:clamp(22px,3.2vh,36px)}
.lyric .now{display:flex;gap:13px;font-size:clamp(22px,2.5vw,34px);line-height:1.36}
.lyric .now::before{content:"";flex:none;width:2px;height:1em;margin-top:.15em;background:var(--sig)}
.lyric .nx{margin-top:9px;padding-left:15px;font-size:15px;color:var(--mute)}

.clock{display:flex;align-items:flex-end;gap:9px;margin-top:clamp(20px,2.8vh,32px);font-family:var(--mono)}
.clock b{font-size:clamp(30px,3.4vw,46px);line-height:1;font-weight:300;letter-spacing:-.02em}
.clock span{font-size:10px;color:var(--mute);padding-bottom:5px}

.struct{display:flex;gap:2px;margin-top:12px;height:6px;cursor:pointer}
.struct span{display:block;flex:0 0 auto;background:rgba(244,243,240,.14);transition:background .2s var(--ease)}
.struct:hover span{background:rgba(244,243,240,.26)}
.struct span.done{background:rgba(244,243,240,.55)}
.struct span.now{background:var(--sig)}

.sname{display:flex;justify-content:space-between;margin-top:9px;font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.sname b{color:var(--dim);font-weight:400}

.transport{display:flex;gap:7px;margin-top:clamp(18px,2.6vh,28px)}
.tb{
  height:38px;min-width:38px;padding:0 12px;background:none;border:1px solid var(--trace);
  color:var(--fg);font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  transition:border-color .18s var(--ease),background .18s var(--ease),color .18s var(--ease);
}
.tb:hover{border-color:var(--fg)}
.tb.on{background:var(--sig);border-color:var(--sig);color:#fff;font-weight:600}
.tb kbd{font-family:var(--mono);font-size:7.5px;color:var(--mute);border:1px solid rgba(244,243,240,.18);padding:1px 3px}
.tb.on kbd{color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.32)}

/* ---------- 右栏：盘 + 队列 ---------- */
/* 盘：只露 3/4，切出画面右缘——"一张唱片被抽出唱套" */
.right{
  position:absolute;right:-60px;top:0;bottom:0;width:66%;
  display:grid;place-items:center;z-index:1;
}
.legend{font-family:var(--mono);font-size:8px;letter-spacing:.2em;color:rgba(244,243,240,.28);text-transform:uppercase}

.disc-wrap{position:relative;display:grid;place-items:center}
.disc{
  position:relative;width:min(56vw,620px);aspect-ratio:1;border-radius:50%;
  background:repeating-radial-gradient(circle at 50% 50%,#0f1012 0 1px,#0a0b0c 1px 4px);
  box-shadow:inset 0 0 0 1px rgba(244,243,240,.09);
}
.disc::after{
  content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 198deg,transparent 0 24%,rgba(244,243,240,.06) 32%,transparent 40%,transparent 72%,rgba(244,243,240,.035) 82%,transparent 90%);
}
.label{
  position:absolute;left:50%;top:50%;width:27%;height:27%;transform:translate(-50%,-50%);
  border-radius:50%;background:var(--art) center/cover;
  border:1px solid rgba(244,243,240,.18);
  filter:saturate(.94) brightness(.9);
  animation:spin 18s linear infinite;
}
.hole{
  position:absolute;left:50%;top:50%;width:2.2%;height:2.2%;transform:translate(-50%,-50%);
  border-radius:50%;background:var(--ink);border:1px solid rgba(244,243,240,.24);z-index:3;
}
.rings{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.rings .ticks{stroke:rgba(244,243,240,.42);stroke-width:.6}
.rings .ticks.on{stroke:rgba(244,243,240,.94)}
.rings .seg-arc{fill:none;stroke-width:3.2}
.rings .seg-arc.past{stroke:rgba(244,243,240,.58)}
.rings .seg-arc.now{stroke:var(--sig)}
.rings .seg-arc.future{stroke:rgba(244,243,240,.20)}
.rings .dot{fill:rgba(244,243,240,.46)}
.rings .dot.on{fill:rgba(244,243,240,.94)}
.rings .dot.cur{fill:var(--sig)}
/* 句长辐射线：当前段内每句一根，长度=这句话唱多久（只有逐字轴能给这个） */
.rings .dens{stroke:rgba(244,243,240,.20);stroke-width:1.1;opacity:0;transition:opacity .25s var(--ease)}
.rings .dens.show{opacity:1}
.rings .dens.done{stroke:rgba(244,243,240,.55)}
.rings .dens.cur{stroke:var(--sig);stroke-width:1.6}
.rings .needle{stroke:rgba(244,243,240,.55);stroke-width:1.1}
.rings .tip{fill:var(--sig)}
.rings .tip-label{fill:var(--sig);font-family:var(--mono);font-size:4px;letter-spacing:.06em}

/* 队列 3 条：宽度收在文字区内，不伸到盘上（灰字压黑盘会消失） */
.queue{display:flex;flex-direction:column;margin-top:22px;max-width:520px}
.queue .qh{
  display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:7px;border-bottom:1px solid var(--trace);
  font-family:var(--mono);font-size:8px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;
}
/* 三条队列封面用不同色偏，避免"三个一样的蓝块" */
.qrow:nth-child(2) .cv{filter:hue-rotate(38deg) saturate(.9)}
.qrow:nth-child(3) .cv{filter:hue-rotate(-52deg) saturate(.8) brightness(.9)}
.qrow:nth-child(4) .cv{filter:hue-rotate(112deg) saturate(.7) brightness(.85)}
.qrow{
  display:grid;grid-template-columns:22px 30px minmax(0,1fr) 46px;
  align-items:center;gap:10px;height:40px;border-bottom:1px solid var(--hair);
}
.qrow .n{font-family:var(--mono);font-size:9px;color:var(--mute)}
.qrow .cv{width:26px;height:26px;background:var(--art) center/cover;border:1px solid var(--hair)}
.qrow .tx{min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .tx small{margin-left:8px;font-size:11px;color:var(--mute)}
.qrow time{font-family:var(--mono);font-size:10.5px;color:var(--mute);text-align:right}

/* 技术行 */
.tech{
  display:flex;gap:18px;margin-top:18px;font-family:var(--mono);font-size:8px;letter-spacing:.18em;
  color:rgba(244,243,240,.34);text-transform:uppercase;
}

@media (max-width:1120px){
  .top,.stage{padding-left:26px;padding-right:26px}
  .stage{grid-template-columns:1fr}
  .right{display:none}
}
</style>
</head>
<body>

<header class="top">
  <span><b>AFEIFEI</b> · 刻纹钟</span>
  <span class="r"><span class="live">● 正在播放</span><span>44.1 / 24</span></span>
</header>

<main class="stage">
  <div class="left">
    <div class="kick rz1"><i></i><span>第 04 首 / 共 12</span></div>
    <h1 class="rz1">老人と海<em>.</em></h1>
    <div class="meta rz2">ヨルシカ · 老人と海 · 2020 · FLAC</div>

    <div class="lyric rz3">
      <div class="now">他梦见狮子回到沙滩上。</div>
      <div class="nx">马林鱼把小船拖进深蓝</div>
    </div>

    <div class="clock rz3"><b data-cur>01:44</b><span>/ 05:21</span></div>
    <div class="struct" id="struct"></div>
    <div class="sname"><span><b id="segName">副歌</b> · <span id="segRange">01:18–02:20</span></span><span>点击跳段</span></div>

    <div class="queue rz4">
      <div class="qh"><span>接下来</span><span>QUEUE · 3</span></div>
      <div class="qrow"><span class="n">02</span><span class="cv"></span><span class="tx">打上花火<small>Daoko / 米津玄師</small></span><time>4:28</time></div>
      <div class="qrow"><span class="n">03</span><span class="cv"></span><span class="tx">Daisy<small>Aimer</small></span><time>4:44</time></div>
      <div class="qrow"><span class="n">04</span><span class="cv"></span><span class="tx">Lay Down<small>Caravan Palace</small></span><time>3:27</time></div>
    </div>

    <div class="transport rz4">
      <button class="tb">◀◀<kbd>←</kbd></button>
      <button class="tb on" id="play">暂停<kbd>空格</kbd></button>
      <button class="tb">▶▶<kbd>→</kbd></button>
      <button class="tb">队列 3</button>
    </div>

    <div class="tech rz5">
      <span>33⅓ RPM</span><span>SIDE A</span><span>44.1kHz / 24bit</span><span id="techPct">已播 32%</span>
      <span class="legend">刻度·时间　弧·段落　点·歌词　短线·句长</span>
    </div>
  </div>

  <div class="right">
    <div class="disc-wrap rz5">
      <div class="disc">
        <div class="label"></div>
        <svg class="rings" viewBox="0 0 200 200" id="rings">
          <g id="ticks"></g>
          <g id="arcs"></g>
          <g id="dens"></g>
          <g id="dots"></g>
          <line class="needle" id="needle" x1="168" y1="14" x2="100" y2="40"></line>
          <circle class="tip" id="ntip" cx="100" cy="40" r="2"></circle>
          <text class="tip-label" id="ntext" x="100" y="40">03:36</text>
        </svg>
        <div class="hole"></div>
      </div>
    </div>
  </div>
</main>

<script>
document.documentElement.style.setProperty('--art',
  'url("file:///C:/Windows/Web/Wallpaper/Windows/img0.jpg")');

const TOTAL = 321;
let pos = 104, playing = true;

const SEGS = [
  {name:'前奏',   s:0,   e:22},
  {name:'主歌 A', s:22,  e:78},
  {name:'副歌',   s:78,  e:140},
  {name:'主歌 B', s:140, e:196},
  {name:'桥段',   s:196, e:246},
  {name:'尾奏',   s:246, e:321}
];
const LINES = [6,12,18,24,31,38,45,52,59,66,73,80,86,92,98,104,110,116,122,128,134,140,148,156,164,172,180,190,200,212,226,240,258,290];
const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const CX = 100, CY = 100, R_DOT = 66;

/* ---------- 三环 ---------- */
const gTicks = document.getElementById('ticks');
const gArcs  = document.getElementById('arcs');
const gDots  = document.getElementById('dots');
const tickEls = [], arcEls = [], dotEls = [];

const TICK_N = 60;
for (let i = 0; i < TICK_N; i++) {
  const a = (i / TICK_N) * Math.PI * 2 - Math.PI / 2;
  const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  l.setAttribute('x1', (CX + Math.cos(a) * 94).toFixed(2));
  l.setAttribute('y1', (CY + Math.sin(a) * 94).toFixed(2));
  l.setAttribute('x2', (CX + Math.cos(a) * 88.5).toFixed(2));
  l.setAttribute('y2', (CY + Math.sin(a) * 88.5).toFixed(2));
  l.setAttribute('class', 'ticks');
  gTicks.appendChild(l); tickEls.push(l);
}

const R_ARC = 80, CIRC = 2 * Math.PI * R_ARC;
SEGS.forEach((sg) => {
  const len = ((sg.e - sg.s) / TOTAL) * CIRC;
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', CX); c.setAttribute('cy', CY); c.setAttribute('r', R_ARC);
  c.setAttribute('class', 'seg-arc future');
  c.setAttribute('stroke-dasharray', `${len.toFixed(2)} ${(CIRC - len).toFixed(2)}`);
  c.setAttribute('transform', `rotate(${((sg.s / TOTAL) * 360 - 90).toFixed(2)} ${CX} ${CY})`);
  gArcs.appendChild(c); arcEls.push(c);
});

/* 歌词点只留"每段首句"的锚点，其余交给句长线（避免点和线说同一件事） */
const segOf = (t) => {
  const i = SEGS.findIndex((s) => t >= s.s && t < s.e);
  return i < 0 ? SEGS.length - 1 : i;
};
LINES.forEach((t, i) => {
  const isFirst = i === 0 || segOf(t) !== segOf(LINES[i - 1]);
  if (!isFirst) return;
  const a = (t / TOTAL) * Math.PI * 2 - Math.PI / 2;
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', (CX + Math.cos(a) * R_DOT).toFixed(2));
  c.setAttribute('cy', (CY + Math.sin(a) * R_DOT).toFixed(2));
  c.setAttribute('r', 1.4);
  c.setAttribute('class', 'dot');
  gDots.appendChild(c); dotEls.push({ el: c, t });
});

/* ---------- 句长辐射线：长度 = 这句话唱多久 ---------- */
const gDens = document.getElementById('dens');
const densEls = [];
LINES.forEach((t, i) => {
  const next = LINES[i + 1] ?? TOTAL;
  const dur = Math.max(1.5, next - t);
  const len = 6 + Math.min(1, dur / 16) * 18;      /* 6–24 单位 */
  const a = (t / TOTAL) * Math.PI * 2 - Math.PI / 2;
  const r1 = 51, r2 = 51 + len;
  const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  l.setAttribute('x1', (CX + Math.cos(a) * r1).toFixed(2));
  l.setAttribute('y1', (CY + Math.sin(a) * r1).toFixed(2));
  l.setAttribute('x2', (CX + Math.cos(a) * r2).toFixed(2));
  l.setAttribute('y2', (CY + Math.sin(a) * r2).toFixed(2));
  l.setAttribute('class', 'dens');
  const si = SEGS.findIndex((s) => t >= s.s && t < s.e);
  l.dataset.seg = si < 0 ? SEGS.length - 1 : si;
  gDens.appendChild(l);
  densEls.push(l);
});

/* ---------- 结构条 ---------- */
const struct = document.getElementById('struct');
SEGS.forEach((sg, i) => {
  const el = document.createElement('span');
  el.style.width = ((sg.e - sg.s) / TOTAL * 100) + '%';
  el.dataset.i = i;
  struct.appendChild(el);
});
struct.addEventListener('click', (e) => {
  const r = struct.getBoundingClientRect();
  pos = Math.max(0, Math.min(TOTAL, (e.clientX - r.left) / r.width * TOTAL));
  paint();
});

/* ---------- 一份时间源 ---------- */
const needle = document.getElementById('needle');
const ntip = document.getElementById('ntip');
const ntext = document.getElementById('ntext');
const segName = document.getElementById('segName');
const segRange = document.getElementById('segRange');
const techPct = document.getElementById('techPct');

function paint() {
  const p = pos / TOTAL;
  document.querySelectorAll('[data-cur]').forEach((el) => { el.textContent = fmt(pos); });
  techPct.textContent = `已播 ${Math.round(p * 100)}%`;

  const litTicks = Math.round(p * TICK_N);
  tickEls.forEach((el, i) => el.classList.toggle('on', i < litTicks));

  let idx = SEGS.findIndex((s) => pos >= s.s && pos < s.e);
  if (idx < 0) idx = SEGS.length - 1;
  arcEls.forEach((el, i) => {
    el.classList.toggle('past', i < idx);
    el.classList.toggle('now', i === idx);
    el.classList.toggle('future', i > idx);
  });

  dotEls.forEach((d) => {
    d.el.classList.toggle('on', d.t <= pos);
  });
  const litDots = LINES.filter((t) => t <= pos).length;

  /* 句长线：只显示当前段内的，已唱变白、正在唱变橙 */
  densEls.forEach((el, i) => {
    const inSeg = +el.dataset.seg === idx;
    el.classList.toggle('show', inSeg);
    if (!inSeg) return;
    const t = LINES[i];
    const next = LINES[i + 1] ?? TOTAL;
    el.classList.toggle('done', t < pos);
    el.classList.toggle('cur', t <= pos && next > pos);
  });

  const ang = p * Math.PI * 2 - Math.PI / 2;
  const tx = CX + Math.cos(ang) * R_DOT, ty = CY + Math.sin(ang) * R_DOT;
  const px = CX + Math.cos(ang) * 112, py = CY + Math.sin(ang) * 112;
  needle.setAttribute('x1', px.toFixed(2)); needle.setAttribute('y1', py.toFixed(2));
  needle.setAttribute('x2', tx.toFixed(2)); needle.setAttribute('y2', ty.toFixed(2));
  ntip.setAttribute('cx', tx.toFixed(2)); ntip.setAttribute('cy', ty.toFixed(2));
  ntext.setAttribute('x', (tx + 6).toFixed(2)); ntext.setAttribute('y', (ty + 1.2).toFixed(2));
  ntext.textContent = fmt(TOTAL - pos);

  [...struct.children].forEach((el, i) => {
    el.classList.toggle('done', i < idx);
    el.classList.toggle('now', i === idx);
  });
  const seg = SEGS[idx];
  segName.textContent = seg.name;
  segRange.textContent = `${fmt(seg.s)}–${fmt(seg.e)}`;
}
paint();
setInterval(() => { if (playing) { pos = Math.min(TOTAL, pos + 0.5); paint(); } }, 500);

/* ---------- 交互 ---------- */
document.getElementById('play').addEventListener('click', (e) => {
  playing = !playing;
  const b = e.currentTarget;
  b.textContent = playing ? '暂停' : '播放';
  const k = document.createElement('kbd'); k.textContent = '空格';
  b.appendChild(k);
  b.classList.toggle('on', playing);
  document.querySelector('.label').style.animationPlayState = playing ? 'running' : 'paused';
});
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); document.getElementById('play').click(); }
  if (e.key === 'ArrowRight') { pos = Math.min(TOTAL, pos + 5); paint(); }
  if (e.key === 'ArrowLeft') { pos = Math.max(0, pos - 5); paint(); }
});
</script>
</body>
</html>
