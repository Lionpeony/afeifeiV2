<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页 · 今日节目单</title>
<style>
/* ============================================================
   首页 · 今日节目单（纸墨语言，与 a2 活字帖 / b2 刻纹现场同一套纪律）
   核心：首页不是"推荐列表"，是**今晚的节目单**——
        大封面 = 今晚主打 · 两列清单 = 演出曲目表 · 报头 = 场次
   三个独有机制同时亮出来：
        大图（第一眼）· 解释器（为什么是这首）· 作品层（源标记）+ 时间机（曲库状态）
   纪律：零圆角 / 零阴影 / 1px 线 / 朱砂只标"正在发生" / 等宽数字 / 细体大字
   ============================================================ */

:root{
  --paper:#f3f1ea;
  --paper2:#ece9df;
  --paper3:#e4e0d4;
  --ink:#17150f;
  --ink2:rgba(23,21,15,.78);
  --ink3:rgba(23,21,15,.46);
  --hair:rgba(23,21,15,.16);
  --hair2:rgba(23,21,15,.09);
  --red:#d8341c;
  --serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  --sans:"Microsoft YaHei Light","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper);color:var(--ink);overflow:hidden;
  font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;
  display:grid;grid-template-columns:76px 1fr;
}

/* ---------- 左导航 ---------- */
nav{
  border-right:1px solid var(--ink);padding:18px 0 16px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
nav .logo{
  writing-mode:vertical-rl;font:600 13px/1.2 var(--serif);letter-spacing:.14em;
  margin-bottom:14px;
}
nav .logo small{display:block;font:400 8px/1 var(--mono);letter-spacing:.24em;color:var(--ink3);margin-top:8px}
nav a{
  writing-mode:vertical-rl;padding:10px 6px;font-size:12px;letter-spacing:.18em;
  color:var(--ink3);text-decoration:none;position:relative;
}
nav a.on{color:var(--ink)}
nav a.on::before{
  content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--red);
}
nav .sp{flex:1}

/* ---------- 主体 ---------- */
main{display:flex;flex-direction:column;min-width:0;height:100%}

/* 报头 */
.head{
  height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;border-bottom:1px solid var(--ink);
  font:400 11px/1 var(--mono);letter-spacing:.16em;color:var(--ink3);text-transform:uppercase;
}
.head b{color:var(--ink);font-weight:400}
.head .r{display:flex;gap:18px;align-items:center}

/* 标题区 */
.title{
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  padding:22px 40px 16px;
}
.title h1{font:200 clamp(38px,4.6vw,62px)/1 var(--serif);letter-spacing:.01em}
.title h1 em{font-style:normal;color:var(--red)}
.title .r{text-align:right;font:400 10px/1.8 var(--mono);letter-spacing:.16em;color:var(--ink3)}
.title .r b{color:var(--ink);font-weight:400}

/* 主体两栏 */
.body{
  flex:1;display:grid;grid-template-columns:minmax(0,54%) minmax(0,46%);
  gap:0 40px;padding:0 40px;min-height:0;
}

/* 左：大封面 + 今晚主打 */
.stage{display:flex;flex-direction:column;min-height:0}
.cover{
  position:relative;aspect-ratio:1;max-height:52vh;margin:0 auto;width:100%;
  background:var(--art) center/cover no-repeat;
  outline:1px solid var(--hair);outline-offset:-1px;
}
.cover::after{
  content:"SIDE A · 01";position:absolute;left:-9px;bottom:-9px;
  background:var(--ink);color:var(--paper);padding:5px 9px;
  font:400 10px/1 var(--mono);letter-spacing:.12em;
}
.pick{margin-top:18px}
.pick .k{font:400 9px/1 var(--mono);letter-spacing:.24em;color:var(--red);text-transform:uppercase}
.pick h2{margin-top:9px;font:200 clamp(30px,3.4vw,50px)/1.06 var(--serif);letter-spacing:.005em}
.pick .by{margin-top:8px;font:400 11px/1 var(--mono);letter-spacing:.14em;color:var(--ink3)}
/* 解释器：为什么是这首 */
.why{
  margin-top:16px;display:flex;align-items:baseline;gap:12px;
  padding:12px 14px;background:var(--paper2);border-left:2px solid var(--red);
}
.why .q{font:400 9px/1 var(--mono);letter-spacing:.2em;color:var(--red);text-transform:uppercase;flex:none}
.why .t{font-size:15px;line-height:1.5;color:var(--ink2)}
.why .t b{font-weight:600}
.why .reroll{
  margin-left:auto;flex:none;background:none;border:1px solid var(--hair);
  padding:5px 9px;font:400 9px/1 var(--mono);letter-spacing:.14em;color:var(--ink3);
  cursor:pointer;text-transform:uppercase;
}
.why .reroll:hover{border-color:var(--red);color:var(--red)}

/* 右：曲目表 */
.sheet{display:flex;flex-direction:column;min-height:0;height:100%}
.sheet .sh{
  display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:9px;border-bottom:1px solid var(--ink);
  font:400 10px/1 var(--mono);letter-spacing:.2em;color:var(--ink3);text-transform:uppercase;
}
.rows{
  flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  grid-auto-rows:44px;gap:0 26px;min-height:0;align-content:start;
}
.row{
  display:grid;grid-template-columns:24px minmax(0,1fr) 46px 42px;align-items:center;gap:9px;
  border-bottom:1px solid var(--hair2);min-height:0;cursor:pointer;
}
.row:hover .t{color:var(--ink)}
.row .n{font:400 10px/1 var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums}
.row .t{font-size:14.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.row .t small{display:block;font:400 10.5px/1.3 var(--mono);letter-spacing:.08em;color:var(--ink3);margin-top:2px}
.row time{font:400 10.5px/1 var(--mono);color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
/* 正在播放：朱砂竖标 + 浓墨 */
.row.live{position:relative}
.row.live::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:2px;background:var(--red)}
.row.live .t{color:var(--ink);font-weight:500}
.row.live .n{color:var(--red)}
/* 作品层：源标记（第 3 列，不能抢曲名的位置） */
.row .src{
  font:400 8px/1 var(--mono);letter-spacing:.1em;color:var(--ink3);
  border:1px solid var(--hair2);padding:2px 4px;text-align:center;
}

/* 底部统计条 */
.stat{
  height:52px;display:flex;align-items:center;gap:22px;padding:0 40px;
  border-top:1px solid var(--ink);
  font:400 10.5px/1 var(--mono);letter-spacing:.12em;color:var(--ink3);text-transform:uppercase;
}
.stat b{color:var(--ink);font-weight:400}
.stat .sp{flex:1}
.stat .go{
  height:32px;padding:0 18px;background:var(--ink);color:var(--paper);border:0;
  font:400 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;
  display:flex;align-items:center;gap:8px;
}
.stat .go{background:var(--red);color:#fff;border:0;height:32px;padding:0 18px;font:400 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:8px}
.stat .go:hover{background:var(--ink)}

/* 入场 */
@keyframes rise{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.r1{animation:rise .55s var(--ease) both}
.r2{animation:rise .55s var(--ease) .09s both}
.r3{animation:rise .55s var(--ease) .18s both}
.r4{animation:rise .55s var(--ease) .27s both}

@media (max-width:1100px){
  .body{grid-template-columns:1fr;gap:20px}
  .cover{max-height:38vh;aspect-ratio:auto;height:38vh}
  .rows{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav>
  <div class="logo">AFEIFEI<small>会听的播放器</small></div>
  <a href="#" class="on">首页</a>
  <a href="#">在线</a>
  <a href="#">收藏</a>
  <a href="#">本地</a>
  <a href="#">下载</a>
  <a href="#">最近</a>
  <a href="#">设置</a>
  <div class="sp"></div>
</nav>

<main>
  <div class="head r1">
    <span><b>AFEIFEI</b> · 今天</span>
    <span class="r"><span>2026.11.03 · 周二</span><span>曲库更新于 11:04</span></span>
  </div>

  <div class="title r2">
    <h1>今日节目单<em>。</em></h1>
    <div class="r">
      <div><b>VOL.12</b> · 第 12 期</div>
      <div>30 首 · 今日 74 分钟</div>
    </div>
  </div>

  <div class="body">
    <!-- 左：今晚主打 -->
    <div class="stage r3">
      <div class="cover" style="--art:url('file:///C:/Windows/Web/Wallpaper/Windows/img0.jpg')"></div>
      <div class="pick">
        <div class="k">今晚主打 · Opening</div>
        <h2>老人と海</h2>
        <div class="by">ヨルシカ · 老人と海 · 2020 · 5:21 · 网易云</div>
      </div>
      <!-- 解释器：为什么是这首（可换一个理由） -->
      <div class="why">
        <span class="q">为什么</span>
        <span class="t">你在 <b>10 月 28 日</b> 之后循环过它 <b>14 次</b>，是同期的第一位</span>
        <button class="reroll">换一个理由</button>
      </div>
    </div>

    <!-- 右：曲目表 -->
    <div class="sheet r4">
      <div class="sh"><span>曲目表 · 16 / 30</span><span>来源</span></div>
      <div class="rows" id="rows"></div>
    </div>
  </div>

  <div class="stat r4">
    <span>今日 <b>74 分钟</b></span>
    <span>红心 <b>12</b></span>
    <span>新入 <b>3</b></span>
    <span>曲库较昨日 <b>+312</b></span>
    <span class="sp"></span>
    <button class="go">▶ 播放今日 16 首</button>
  </div>
</main>

<script>
/* ---------- 曲目表：16 行，含作品层的源标记 ---------- */
const LIST = [
  ['01','老人と海','ヨルシカ','5:21','网易云',true],
  ['02','打上花火','Daoko / 米津玄師','4:28','网易云',false],
  ['03','Daisy','Aimer','4:44','QQ 音乐',false],
  ['04','Lay Down','Caravan Palace','3:27','本地',false],
  ['05','八月のエンドレス','米津玄師','4:02','网易云',false],
  ['06','Lemon','米津玄師','4:03','网易云',false],
  ['07','アイネクライネ','米津玄師 / ヨルシカ','4:26','QQ 音乐',false],
  ['08','KICK BACK','米津玄師','3:30','本地',false],
  ['09','orion','米津玄師','4:07','网易云',false],
  ['10',' gremlin','米津玄師','4:01','QQ 音乐',false],
  ['11','龍の Opera','米津玄師','4:06','本地',false],
  ['12','LOSER','米津玄師','4:05','网易云',false],
  ['13','我只在意你','毛不易','4:07','QQ 音乐',false],
  ['14','起风了','买辣椒也用券','5:25','本地',false],
  ['15','漠河舞厅','柳爽','5:16','网易云',false],
  ['16','漠河舞厅 · 现场版','柳爽','6:02','本地',false]
];

const rows = document.getElementById('rows');
LIST.forEach(([no, t, by, dur, src, live]) => {
  const el = document.createElement('div');
  el.className = 'row' + (live ? ' live' : '');
  el.innerHTML =
    `<span class="n">${no}</span>` +
    `<span class="t">${t}<small>${by}</small></span>` +
    `<span class="src">${src}</span>` +
    `<time>${dur}</time>`;
  rows.appendChild(el);
});
</script>
</body>
</html>
