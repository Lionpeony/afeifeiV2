/* ---------- 极简交互音效（WebAudio 合成，无需素材文件；默认低于音乐音量） ---------- */
(function () {
  let ctx = null;
  let enabled = true;

  function ac() {
    if (!enabled) return null;
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    } catch (e) { return null; }
  }

  function env(node, t0, attack, decay, peak) {
    const g = node.gain;
    g.setValueAtTime(0.0001, t0);
    g.exponentialRampToValueAtTime(peak, t0 + attack);
    g.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);
  }

  function tone({ freq = 440, type = "sine", dur = 0.18, gain = 0.05, slide = 0, delay = 0 }) {
    const a = ac(); if (!a) return;
    const t0 = a.currentTime + delay;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
    env(g, t0, 0.008, dur, gain);
    o.connect(g).connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  function noise({ dur = 0.14, gain = 0.03, freq = 1800, q = 1, delay = 0 }) {
    const a = ac(); if (!a) return;
    const t0 = a.currentTime + delay;
    const len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = a.createBufferSource(); src.buffer = buf;
    const bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = q;
    const g = a.createGain(); env(g, t0, 0.01, dur, gain);
    src.connect(bp).connect(g).connect(a.destination);
    src.start(t0);
  }

  const Sound = {
    setEnabled(v) { enabled = v; },
    /* E01 / E03 拨弦 */
    pluck() {
      tone({ freq: 392, type: "triangle", dur: 0.22, gain: 0.055, slide: 120 });
      tone({ freq: 587, type: "sine", dur: 0.16, gain: 0.03, delay: 0.02 });
    },
    /* 清脆叮 */
    ding() {
      tone({ freq: 1046, type: "sine", dur: 0.16, gain: 0.045 });
      tone({ freq: 1568, type: "sine", dur: 0.12, gain: 0.022, delay: 0.03 });
    },
    /* 纸页翻动 */
    paper() {
      noise({ dur: 0.12, gain: 0.028, freq: 2600, q: 0.8 });
      noise({ dur: 0.09, gain: 0.018, freq: 1500, q: 1.2, delay: 0.07 });
    },
    /* 按下 */
    tap() {
      tone({ freq: 660, type: "sine", dur: 0.06, gain: 0.022, slide: -80 });
    },
    /* 远场欢呼 */
    crowd() {
      noise({ dur: 0.9, gain: 0.03, freq: 700, q: 0.5 });
      noise({ dur: 0.7, gain: 0.02, freq: 1400, q: 0.7, delay: 0.15 });
    },
    /* 暗号解锁 */
    unlock() {
      [523, 659, 784, 1046].forEach((f, i) =>
        tone({ freq: f, type: "sine", dur: 0.2, gain: 0.038, delay: i * 0.075 }));
    }
  };

  window.Sound = Sound;
})();

  ]

function lyricsFor(track) {
  return LYRIC_SETS[hashStr(track.title + track.band) % LYRIC_SETS.length];
}

const LyricsStrip = ({ track, pos }) => {
  const lines = React.useMemo(() => lyricsFor(track), [track.id]);
  const per = track.dur / lines.length;
  const cur = Math.max(0, Math.min(lines.length - 1, Math.floor(pos / per)));
  return (
    <div className="np__lyrics">
      <div className="np__lyrics-inner">
        {lines.map((l, i) => {
          const d = i - cur;
          if (Math.abs(d) > 1) return null;
          return (
            <div key={i} className={"np__lyric-line" + (d === 0 ? " is-cur" : d < 0 ? " is-prev" : " is-next")}>
              {l}
            </div>
          );
        })}
        <span className="np__lyrics-tag">歌词 · 虚构演示</span>

};

const FakeQR = ({ seed = "afeifei", size = 96 }) => {
  const n = 11;
  const h = hashStr(seed);
  const cells = [];
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const finder = (x < 4 && y < 4) || (x > n - 5 && y < 4) || (x < 4 && y > n - 5);
      if (finder) continue;
      const bit = (h >>> ((x * 5 + y * 7) % 29)) & 1;
      if (bit) cells.push([x, y]);
    }
  }
  const Finder = ({ fx, fy }) => (
    <g>
      <rect x={fx} y={fy} width="4" height="4" rx="1" />
      <rect x={fx + 1} y={fy + 1} width="2" height="2" fill="#fff" />
    </g>
  );
  return (
    <svg className="auth-src__qr" width={size} height={size} viewBox={"0 0 " + n + " " + n} aria-hidden="true">
      <rect width={n} height={n} fill="#fff" />
      <g fill="#2E2028">
        {cells.map(([x, y], i) => <rect key={i} x={x} y={y} width="1" height="1" />)}
        <Finder fx={0} fy={0} /><Finder fx={n - 4} fy={0} /><Finder fx={0} fy={n - 4} />
      </g>
    </svg>
  );
};

function Playlists() {
  const { source, setSource, savedLists, saveList, playAll, setPage, liked, toast, onoma, onomaAt } = useApp();
  const lists = PLAYLISTS[source] || [];

    return lists.some(l => l.id === want) ? want : lists[0].id;

  const [reloading, setReloading] = React.useState(false);

  const firstRun = React.useRef(true);
  React.useEffect(() => {

  const sel = lists.find(l => l.id === selId) || lists[0];
  const src = SOURCES[source];

  const reload = () => {
    if (reloading) return;
    setReloading(true);
    setTimeout(() => setReloading(false), 460);

  const doImport = () => {

              onClick={() => setSelId(l.id)} style={enterStyle(i, 26)}>
              <span className="pl-row__art">
                <TrackArt id={source + l.id} size={38} radius={8} />
              </span>
              <span className="pl-row__text">

                <button className="btn btn-primary btn-sm" onClick={() => playAll(sel.tracks)}>
                  <IconPlay size={13} />播放全部

                <button className={"btn btn-ghost btn-sm" + (savedLists.includes(source + sel.id) ? " is-saved" : "")}
                  onClick={e => { saveList(source + sel.id, sel.name); onomaAt(e.currentTarget, "ポンッ", "coral"); }}>

/* 切音源时默认选中第一张 */
function PLATFORMS_FIRST(source) {

<script type="text/babel">
/* ---------- 全局搜索浮层 ---------- */
const Mark = ({ text, q }) => {
  const key = (q || "").trim();
  if (!key) return <>{text}</>;
  const i = text.toLowerCase().indexOf(key.toLowerCase());
  if (i < 0) return <>{text}</>;
  return (
    <>
      {text.slice(0, i)}
      <mark className="hl">{text.slice(i, i + key.length)}</mark>
      {text.slice(i + key.length)}
    </>
  );
};

const SourceDots = ({ avail }) => (
  <span className="src-dots">
    {Object.values(SOURCES).map(s => {
      const st = (avail && avail[s.id]) || "ok";
      return (
        <span key={s.id} className={"src-dot" + (st === "ok" ? " is-ok" : st === "vip" ? " is-vip" : " is-none")}
          style={{ "--src": s.tone }} title={s.name + " · " + AVAIL_LABEL[st]}>
          {st === "ok" ? s.short : st === "vip" ? "VIP" : "—"}
        </span>
      );
    })}
  </span>
);

function SearchOverlay({ q, onClose }) {
  const { playAt, tryPlay, source, setPage } = useApp();
  const [tab, setTab] = React.useState("track");
  const [busy, setBusy] = React.useState(false);
  const key = (q || "").trim().toLowerCase();

  React.useEffect(() => {
    if (!key) return;
    setBusy(true);
    const t = setTimeout(() => setBusy(false), 240);
    return () => clearTimeout(t);
  }, [key]);

  React.useEffect(() => {
    const fn = e => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", fn);
    return () => document.removeEventListener("keydown", fn);
  }, [onClose]);

  const hit = s => s.toLowerCase().includes(key);
  const tracks = key ? TRACKS.filter(t => hit(t.title) || hit(t.artist) || hit(t.album)) : [];
  const artists = key ? Array.from(new Set(TRACKS.filter(t => hit(t.artist)).map(t => t.artist))) : [];
  const albums = key ? Object.values(RELEASES).filter(r => hit(r.title) || hit(r.band)) : [];
  const lists = key
    ? ["netease", "qq"].flatMap(sid => (PLAYLISTS[sid] || []).map(p => ({ ...p, src: sid }))).filter(p => hit(p.name))
    : [];

  const tabs = [
    { id: "track", label: "单曲", n: tracks.length },
    { id: "artist", label: "艺人", n: artists.length },
    { id: "album", label: "专辑", n: albums.length },
    { id: "list", label: "歌单", n: lists.length }
  ];

  const total = tracks.length + artists.length + albums.length + lists.length;

  return (
    <>
      <div className="search-scrim" onPointerDown={onClose}></div>
      <div className="search-overlay" role="dialog" aria-label="搜索结果">
        <div className="search-overlay__tabs">
          {tabs.map(t => (
            <button key={t.id}
              className={"search-tab" + (tab === t.id ? " is-on" : "")}
              onClick={() => setTab(t.id)}>
              {t.label}
              <span className="num">{t.n}</span>
            </button>
          ))}
          <span className="search-overlay__total meta">
            「{q.trim()}」共 {total} 条
          </span>
        </div>

        <div className="search-overlay__body">
          {busy ? (
            <div className="search-busy">
              <span className="search-busy__guitar"><GuitarFigure w={110} h={52} /></span>
              <span className="hand">在翻曲库……</span>
            </div>
          ) : total === 0 ? (
            <div className="search-empty-note loop">
              <Tape w={60} rot={-2.5} style={{ top: -9, left: "50%", marginLeft: -30 }} />
              <p>这家 live house 没找到这首曲子。</p>
              <span className="hand">换个词试试，或者去漫游随便听听。</span>
              <button className="btn btn-soft btn-sm" onClick={() => { onClose(); setPage("wander"); }}>
                去迷路漫游<IconArrowRight size={14} />
              </button>
            </div>
          ) : tab === "track" ? (
            <div className="sr-list">
              {tracks.map((t, i) => {
                const av = (t.avail && t.avail[source]) || "ok";
                return (
                  <button key={t.id} className={"sr-row" + (av !== "ok" ? " is-dim" : "")}
                    onClick={() => { tryPlay(t.id, tracks.map(x => x.id), i); onClose(); }}>
                    <img className="sr-row__art" src={t.cover} alt="" />
                    <span className="sr-row__main">
                      <span className="sr-row__title truncate"><Mark text={t.title} q={q} /></span>
                      <span className="sr-row__sub truncate">
                        <Mark text={t.artist} q={q} /> · <Mark text={t.album} q={q} />
                      </span>
                    </span>
                    <SourceDots avail={t.avail} />
                    <span className="sr-row__dur num">{fmt(t.dur)}</span>
                  </button>
                );
              })}
            </div>
          ) : tab === "artist" ? (
            <div className="sr-artists">
              {artists.map(a => {
                const own = TRACKS.filter(t => t.artist === a);
                return (
                  <button key={a} className="sr-artist" onClick={() => { playAt(own.map(t => t.id), 0); onClose(); }}>
                    <span className="sr-artist__avatar">{a.slice(0, 1)}</span>
                    <span className="sr-artist__name truncate"><Mark text={a} q={q} /></span>
                    <span className="meta">{own.length} 首 · {own[0].album}</span>
                  </button>
                );
              })}
            </div>
          ) : tab === "album" ? (
            <div className="sr-list">
              {albums.map(r => (
                <button key={r.id} className="sr-row" onClick={() => { onClose(); setPage("discover"); }}>
                  <img className="sr-row__art" src={r.cover} alt="" />
                  <span className="sr-row__main">
                    <span className="sr-row__title truncate"><Mark text={r.title} q={q} /></span>
                    <span className="sr-row__sub truncate">
                      <Mark text={r.band} q={q} /> · {r.kind}
                    </span>
                  </span>
                  <span className="sr-row__tag">{TRACKS.filter(t => t.release === r.id).length} 首</span>
                </button>
              ))}
            </div>
          ) : (
            <div className="sr-list">
              {lists.map(p => (
                <button key={p.src + p.id} className="sr-row"
                  onClick={() => { onClose(); setPage("playlists"); }}>
                  <span className="sr-row__art sr-row__art--art">
                    <TrackArt id={p.src + p.id} size={40} radius={9} />
                  </span>
                  <span className="sr-row__main">
                    <span className="sr-row__title truncate"><Mark text={p.name} q={q} /></span>
                    <span className="sr-row__sub truncate">{p.tracks.length} 首 · {SOURCES[p.src].name}</span>
                  </span>
                  <span className="sr-row__tag" style={{ color: SOURCES[p.src].tone }}>
                    {SOURCES[p.src].short}
                  </span>
                </button>
              ))}
            </div>
          )}
        </div>

        <div className="search-overlay__foot">
          <span className="meta">结果全部为虚构演示数据 · 音源标签表示哪家收录了这首</span>
          <span className="meta">Esc 关闭</span>
        </div>
      </div>
    </>
  );
}

Object.assign(window, { SearchOverlay, Mark, SourceDots });

</script>
<script type="text/babel">
/* ---------- 歌曲行「更多」菜单 ---------- */
function RowMenu() {
  const {
    rowMenu, closeRowMenu, source, accounts, liked, toggleLike, tryPlay, playNext,
    addDownload, toast, onoma, setPage, openPlayer
  } = useApp();

  React.useEffect(() => {
    setSub(false);

  React.useEffect(() => {
    const fn = e => {
      if (e.type === "keydown" && e.key !== "Escape") return;

      closeRowMenu();
    };
    document.addEventListener("keydown", fn);
    document.addEventListener("pointerdown", fn);
    return () => {
      document.removeEventListener("keydown", fn);
      document.removeEventListener("pointerdown", fn);

  if (!rowMenu) return null;

          toggleLike(t.id);

        }}>{isOn ? "取消收藏" : "收藏到我喜欢的音乐"}</Item>
        <Item icon={IconPlus} onClick={() => setSub(s => !s)} hint={sub ? "收起" : "选择"}>收藏到歌单</Item>

          toast(`《${t.album}》的专辑页在原型里是占位`, { hand: true });
          closeRowMenu();

        <Item icon={IconUser} onClick={() => {
          toast(`${t.artist} 的艺人页在原型里是占位`, { hand: true });
          closeRowMenu();

      {sub && (
        <div className="rowmenu__sub">
          <div className="rowmenu__sub-title eyebrow">加入哪个歌单</div>

            <button key={p.id} className="rowmenu__sublist"

<script type="text/babel">
/* ---------- 播放页 · 舞台 ---------- */
function NowPlaying() {
  const {
    track, playing, setPlaying, pos, setPos, userSkip, prevTrack,
    shuffle, toggleShuffle, repeat, setRepeat, liked, toggleLike,
    queueIds, goTo, setPlayerOpen, chorusAt, markChorus, struckId, reduce, currentId, sheerSide, closePlayer, playerClosing, onoma, onomaAt, lyricsOn, setLyricsOn
  } = useApp();

  const barRef = React.useRef(null);
  const pressTimer = React.useRef(null);
  const longPressed = React.useRef(false);
  const [dragging, setDragging] = React.useState(false);

  const ratioFromEvent = (e) => {
    const r = barRef.current.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  };
  const seek = (e) => {
    const r = ratioFromEvent(e);
    setPos(r * track.dur);
  };
  const onDown = (e) => {
    longPressed.current = false;
    setDragging(true);
    clearTimeout(pressTimer.current);
    const r = ratioFromEvent(e);
    pressTimer.current = setTimeout(() => {
      longPressed.current = true;
      markChorus(r * track.dur);
      if (window.Sound) Sound.ding();
    }, 550);
  };
  const onUp = (e) => {
    clearTimeout(pressTimer.current);
    if (!longPressed.current) seek(e);
    setDragging(false);
  };

  const chorusPct = chorusAt != null ? (chorusAt / track.dur) * 100 : null;
  const showChorusHint = chorusAt != null && pos >= chorusAt - 8 && pos < chorusAt;

  const acts = React.useMemo(() => {
    if (queueIds.length <= 12) return [queueIds];
    const out = [];
    for (let i = 0; i < queueIds.length; i += 4) out.push(queueIds.slice(i, i + 4));
    return out;
  }, [queueIds]);

  const totalDur = queueIds.reduce((s, id) => s + TRACK_MAP[id].dur, 0);
  const idx = queueIds.indexOf(currentId);

  return (
    <div className={"np" + (playerClosing ? " np--closing" : "")} data-screen-label="播放页" role="dialog" aria-label="播放页">
      {!reduce && !playerClosing && (
        <>

          <div className="curtain curtain--r"></div>
        </>
      )}
      {!reduce && playerClosing && (
        <>
          <div className="curtain curtain--close curtain--close-l"></div>
          <div className="curtain curtain--close curtain--close-r"></div>
        </>
      )}

        </button>
        <span style={{ width: 1, height: 16, background: "var(--line)" }}></span>
        <span className="np__top-label">
          <IconNote size={13} />
          正在演出 · SETLIST {String(idx + 1).padStart(2, "0")} / {String(queueIds.length).padStart(2, "0")}
        </span>
        <span className="spacer"></span>
        <span className="meta hand" style={{ fontSize: 12 }}>{Math.round(totalDur / 60)} 分钟就散场</span>
      </div>

      <div className="np__main">
        <div className="np__stage">
          <div className={"np__art" + (playing ? " loop is-breathing" : "")}>
            <Tape w={78} rot={-4} style={{ top: -11, left: 34 }} />
            <img key={track.id} className="np__art-img" src={track.cover} alt={track.releaseTitle} />
            <span className="np__art-badge">
              <IconPick size={40} style={{ position: "absolute", opacity: .16 }} />
              <b style={{ position: "relative" }}>{String(queueIds.indexOf(currentId) + 1).padStart(2, "0")}</b>
            </span>
            {struckId && <span className={"sheer is-on sheer--" + (sheerSide || "r")}></span>}

const AppCtx = React.createContext(null);
const useApp = () => React.useContext(AppCtx);

const STORE = "afeifei.v31.";
function load(key, fallback) {
  try {
    const raw = localStorage.getItem(STORE + key);
    if (raw == null) return fallback;
    return JSON.parse(raw);
  } catch (e) { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(STORE + key, JSON.stringify(value)); } catch (e) {}
}

function App() {
  const { useState, useEffect, useMemo, useRef, useCallback } = React;
  const params = useMemo(() => new URLSearchParams(location.search), []);

  /* ---------- 持久化偏好 ---------- */

  const [accounts, setAccounts] = useState(() => load("accounts", { netease: false, qq: false }));

    miniMode, setMiniMode, lyricsBar, setLyricsBar, rowMenu, openRowMenu, closeRowMenu,
    addDownload, playNext, crossPlay, tryPlay
  };

  return (
    <AppCtx.Provider value={ctx}>
      {!loggedIn ? <Auth /> : miniMode ? <MiniCard /> : (
        <div className={"app" + (density === "compact" ? " is-compact" : "")}>
          <Sidebar />
          <div className="main">
            <TopBar />
            <div className="main__page scroll" key={page}>
              {page === "discover" && <Discover />}
              {page === "wander" && <Wander />}
              {page === "local" && <LocalFiles mode="local" />}
              {page === "downloads" && <LocalFiles mode="downloads" />}
              {page === "likes" && <Likes />}
              {page === "playlists" && <Playlists />}
              {page === "archive" && <Archive />}
              {page === "settings" && <Settings />}
            </div>
            <MiniPlayer />
          </div>
        </div>
      )}
      {playerOpen && loggedIn && !miniMode && <NowPlaying />}
      {loggedIn && !miniMode && <RowMenu />}
      {loggedIn && !miniMode && lyricsBar && <LyricsBar />}
      <EggLayer boot={loggedIn && boot} />
      <Toasts items={toasts} />
      {bloomKey > 0 && <span key={bloomKey} className="bloom" aria-hidden="true" />}
      {focusKey > 0 && <FocusLines key={focusKey} />}
      <OnomaLayer items={onomas} />
      {mascot && <MascotWalk onEnd={() => setMascot(false)} />}
      {demoOpen && <DemoPanel />}
    </AppCtx.Provider>
  );
}

Object.assign(window, { AppCtx, useApp, App });

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
